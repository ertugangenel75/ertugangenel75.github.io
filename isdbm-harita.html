<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ISDBM Digital — Harita Analizi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }

  /* Top bar */
  .topbar {
    height: 52px; background: #fff; border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 1000;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { font-size: 15px; font-weight: 800; color: #0f172a; }
  .brand-logo span { color: #2563eb; }
  .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #64748b; }
  .tab-bar { display: flex; gap: 4px; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: #64748b; border: 1px solid transparent; }
  .tab.active { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .tab:hover:not(.active) { background: #f8fafc; }

  /* Layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Left panel */
  .panel { width: 340px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
  .panel-section { padding: 16px; border-bottom: 1px solid #f1f5f9; }
  .panel-title { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 12px; }

  /* Form elements */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .form-group label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 500; }
  .form-group input, .form-group select {
    width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 7px;
    font-size: 13px; color: #0f172a; background: #fff; outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: #2563eb; }

  .btn { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #f8fafc; color: #374151; border: 1px solid #e2e8f0; width: 100%; }
  .btn-secondary:hover { background: #f1f5f9; }

  /* Parcel info */
  .info-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f8fafc; font-size: 13px; }
  .info-row .key { color: #64748b; }
  .info-row .val { font-weight: 600; color: #0f172a; text-align: right; }

  /* Score rings */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric-card { background: #f8fafc; border-radius: 8px; padding: 12px; text-align: center; }
  .metric-label { font-size: 11px; color: #64748b; margin-top: 6px; }
  .metric-sub { font-size: 11px; font-weight: 600; margin-top: 2px; }

  /* Map */
  #map { flex: 1; z-index: 1; }

  /* Map controls overlay */
  .map-overlay { position: absolute; top: 10px; right: 10px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
  .map-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 7px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; color: #374151; }
  .map-btn.active { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .map-btn:hover { background: #f1f5f9; }

  /* Search bar on map */
  .map-search { position: absolute; top: 10px; left: 10px; z-index: 999; background: #fff; border-radius: 9px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; width: 280px; }
  .map-search input { border: none; outline: none; font-size: 13px; flex: 1; color: #0f172a; }
  .map-search-icon { color: #94a3b8; font-size: 16px; }

  /* Results popup */
  .search-results { position: absolute; top: 52px; left: 10px; z-index: 1000; background: #fff; border-radius: 9px; border: 1px solid #e2e8f0; width: 280px; max-height: 200px; overflow-y: auto; }
  .search-result-item { padding: 10px 14px; font-size: 13px; cursor: pointer; color: #0f172a; border-bottom: 1px solid #f8fafc; }
  .search-result-item:hover { background: #eff6ff; color: #2563eb; }

  /* Bottom status bar */
  .statusbar { height: 32px; background: #0f172a; color: #94a3b8; font-size: 11px; display: flex; align-items: center; padding: 0 16px; gap: 20px; flex-shrink: 0; }
  .statusbar span { color: #60a5fa; }

  /* Parcel marker popup */
  .parcel-popup { font-family: system-ui; }
  .parcel-popup h3 { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
  .parcel-popup p { font-size: 12px; color: #64748b; margin: 2px 0; }
  .parcel-popup .score { display: inline-block; background: #dcfce7; color: #16a34a; border-radius: 10px; padding: 2px 8px; font-weight: 700; font-size: 12px; margin-top: 6px; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #64748b; font-size: 14px; flex-direction: column; gap: 8px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">ISDBM <span>Digital</span></div>
    <div style="width:1px;height:18px;background:#e2e8f0;margin:0 4px"></div>
    <div style="font-size:12px;color:#64748b">Harita Analizi</div>
  </div>
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('harita')">🗺️ Harita</div>
    <div class="tab" onclick="switchTab('uydu')">🛰️ Uydu</div>
    <div class="tab" onclick="switchTab('yukseklik')">📊 Yükseklik</div>
  </div>
  <div class="topbar-right">
    <span>Hayati Küçük</span>
    <div style="width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">HK</div>
  </div>
</div>

<div class="main" style="position:relative">

  <!-- Left Panel -->
  <div class="panel" id="panel">

    <!-- Parcel Query Form -->
    <div class="panel-section">
      <div class="panel-title">📍 Parsel Sorgula</div>
      <div class="form-row-3">
        <div class="form-group">
          <label>İl</label>
          <select id="il-select" onchange="onIlChange()">
            <option value="istanbul">İstanbul</option>
            <option value="ankara">Ankara</option>
            <option value="izmir">İzmir</option>
            <option value="bursa">Bursa</option>
            <option value="antalya">Antalya</option>
          </select>
        </div>
        <div class="form-group">
          <label>İlçe</label>
          <select id="ilce-select" onchange="onIlceChange()">
            <option value="pendik">Pendik</option>
            <option value="kadikoy">Kadıköy</option>
            <option value="besiktas">Beşiktaş</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mahalle</label>
          <select id="mahalle-select">
            <option>Velibaba</option>
            <option>Kaynarca</option>
            <option>Kurtköy</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Ada</label>
          <input id="ada-input" type="text" value="1254" placeholder="Ada no" />
        </div>
        <div class="form-group">
          <label>Parsel</label>
          <input id="parsel-input" type="text" value="7" placeholder="Parsel no" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="sorgulaParsel()" style="margin-bottom:8px">🔍 Haritada Göster</button>
      <button class="btn btn-secondary" onclick="konumSorgu()">📡 Mevcut Konumumu Göster</button>
    </div>

    <!-- Parcel Info (hidden until search) -->
    <div class="panel-section hidden" id="parcel-info">
      <div class="panel-title">📋 Parsel Bilgileri</div>
      <div id="parcel-info-rows"></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="analizBasla()">⚡ Analiz Başlat</button>
    </div>

    <!-- Analysis Results (hidden until analysis) -->
    <div class="panel-section hidden" id="analysis-section">
      <div class="panel-title">📊 Çevre Analizi (1 km)</div>
      <div class="metrics-grid" id="metrics-grid"></div>
    </div>

    <!-- Nearby info -->
    <div class="panel-section hidden" id="nearby-section">
      <div class="panel-title">🔗 Yakın Çevre</div>
      <div id="nearby-list"></div>
    </div>

    <!-- Saved parcels -->
    <div class="panel-section">
      <div class="panel-title">⭐ Kayıtlı Parseller</div>
      <div id="saved-parcels">
        <div style="font-size:12px;color:#94a3b8;text-align:center;padding:12px">Henüz kayıtlı parsel yok.</div>
      </div>
    </div>

  </div>

  <!-- Map container -->
  <div style="flex:1;position:relative">
    <div id="map-search" class="map-search">
      <span class="map-search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Adres, mahalle veya koordinat ara..." onkeyup="searchAddress(event)" />
    </div>
    <div id="search-results" class="search-results hidden"></div>

    <div class="map-overlay">
      <button class="map-btn active" id="btn-osm" onclick="switchLayer('osm')">OSM</button>
      <button class="map-btn" id="btn-satellite" onclick="switchLayer('satellite')">Uydu</button>
      <button class="map-btn" id="btn-topo" onclick="switchLayer('topo')">Topo</button>
      <div style="height:8px"></div>
      <button class="map-btn" onclick="drawParcel()">✏️ Çiz</button>
      <button class="map-btn" onclick="clearDrawing()">🗑️</button>
    </div>

    <div id="map"></div>
  </div>

</div>

<!-- Status bar -->
<div class="statusbar">
  <div>Koordinat: <span id="coord-display">—</span></div>
  <div>Zoom: <span id="zoom-display">—</span></div>
  <div>Katman: <span id="layer-display">OpenStreetMap</span></div>
  <div style="margin-left:auto">© OpenStreetMap katkıcıları | ISDBM Digital</div>
</div>

<script>
// ── Map init ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([40.9267, 29.1200], 14);

const LAYERS = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> katkıcıları',
    maxZoom: 19
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri — Esri, DigitalGlobe, GeoEye',
    maxZoom: 19
  }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenTopoMap',
    maxZoom: 17
  })
};

let currentLayer = LAYERS.osm;
currentLayer.addTo(map);

// Status bar updates
map.on('mousemove', e => {
  document.getElementById('coord-display').textContent =
    e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
});
map.on('zoom', () => {
  document.getElementById('zoom-display').textContent = map.getZoom();
});
document.getElementById('zoom-display').textContent = map.getZoom();

// ── Layer switching ───────────────────────────────────────────────────────
function switchLayer(name) {
  map.removeLayer(currentLayer);
  currentLayer = LAYERS[name];
  currentLayer.addTo(map);
  document.querySelectorAll('.map-overlay .map-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name)?.classList.add('active');
  const labels = { osm: 'OpenStreetMap', satellite: 'Uydu (Esri)', topo: 'Topografik' };
  document.getElementById('layer-display').textContent = labels[name] || name;
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (t === 'uydu') switchLayer('satellite');
  else if (t === 'yukseklik') switchLayer('topo');
  else switchLayer('osm');
}

// ── Mock parcel data ──────────────────────────────────────────────────────
const MOCK_PARCELS = {
  'istanbul-pendik-1254-7': {
    lat: 40.9267, lng: 29.1200,
    coords: [[40.9280,29.1170],[40.9280,29.1230],[40.9255,29.1230],[40.9255,29.1170]],
    info: { 'İl / İlçe': 'İstanbul / Pendik', 'Mahalle': 'Velibaba', 'Ada / Parsel': '1254 / 7',
             'Yüzölçümü': '24.850 m²', 'Niteliği': 'Arsa', 'Plan Durumu': 'Sanayi Bölgesi', 'Tapu Durumu': 'Özel Mülk' },
    metrics: [
      { label: 'Ulaşım', score: 86, color: '#16a34a' },
      { label: 'Demografi', score: 72, color: '#2563eb' },
      { label: 'Ticari Potansiyel', score: 81, color: '#16a34a' },
      { label: 'Altyapı', score: 89, color: '#16a34a' },
      { label: 'Risk', score: 74, color: '#2563eb' },
      { label: 'Gelişme', score: 91, color: '#16a34a' },
    ],
    nearby: [
      { icon: '🚇', label: 'Metro / Raylı Sistem', val: '2.3 km' },
      { icon: '🏨', label: 'Otel', val: '1.8 km' },
      { icon: '✈️', label: 'Havalimanı', val: '14 km' },
      { icon: '⚓', label: 'Liman', val: '15 km' },
    ]
  },
  'istanbul-kadikoy-2100-3': {
    lat: 40.9900, lng: 29.0300,
    coords: [[40.9910,29.0280],[40.9910,29.0320],[40.9890,29.0320],[40.9890,29.0280]],
    info: { 'İl / İlçe': 'İstanbul / Kadıköy', 'Mahalle': 'Moda', 'Ada / Parsel': '2100 / 3',
             'Yüzölçümü': '8.200 m²', 'Niteliği': 'Arsa', 'Plan Durumu': 'Konut + Ticaret', 'Tapu Durumu': 'Özel Mülk' },
    metrics: [
      { label: 'Ulaşım', score: 95, color: '#16a34a' },
      { label: 'Demografi', score: 88, color: '#16a34a' },
      { label: 'Ticari Potansiyel', score: 90, color: '#16a34a' },
      { label: 'Altyapı', score: 92, color: '#16a34a' },
      { label: 'Risk', score: 65, color: '#2563eb' },
      { label: 'Gelişme', score: 78, color: '#2563eb' },
    ],
    nearby: [
      { icon: '🚇', label: 'Metro', val: '0.4 km' },
      { icon: '🛒', label: 'AVM', val: '1.1 km' },
      { icon: '🏥', label: 'Hastane', val: '2.2 km' },
      { icon: '🏫', label: 'Üniversite', val: '3.0 km' },
    ]
  }
};

// ── Marker & polygon state ────────────────────────────────────────────────
let currentMarker = null;
let currentPolygon = null;
let drawnItems = L.featureGroup().addTo(map);
let isDrawing = false;
let drawPoints = [];
let drawPolyline = null;
let savedParcels = [];

// ── Parcel query ──────────────────────────────────────────────────────────
function sorgulaParsel() {
  const il = document.getElementById('il-select').value;
  const ilce = document.getElementById('ilce-select').value;
  const ada = document.getElementById('ada-input').value.trim();
  const parsel = document.getElementById('parsel-input').value.trim();

  if (!ada || !parsel) {
    alert('Lütfen ada ve parsel numarası giriniz.');
    return;
  }

  const key = `${il}-${ilce}-${ada}-${parsel}`;
  const data = MOCK_PARCELS[key];

  if (data) {
    showParcel(data, `${ada}/${parsel}`);
  } else {
    // Generic fallback — geocode with Nominatim
    const ilNames = { istanbul:'İstanbul', ankara:'Ankara', izmir:'İzmir', bursa:'Bursa', antalya:'Antalya' };
    const ilcNames = { pendik:'Pendik', kadikoy:'Kadıköy', besiktas:'Beşiktaş' };
    geocodeAddress(`${ilcNames[ilce]}, ${ilNames[il]}, Türkiye`, (lat, lng) => {
      const mockData = {
        lat, lng,
        coords: [
          [lat + 0.0012, lng - 0.0015],
          [lat + 0.0012, lng + 0.0015],
          [lat - 0.0012, lng + 0.0015],
          [lat - 0.0012, lng - 0.0015]
        ],
        info: {
          'İl / İlçe': `${ilNames[il]} / ${ilcNames[ilce]}`,
          'Ada / Parsel': `${ada} / ${parsel}`,
          'Yüzölçümü': `${(Math.random()*20000+5000).toFixed(0)} m²`,
          'Niteliği': 'Arsa',
          'Plan Durumu': '—',
          'Tapu Durumu': 'Özel Mülk'
        },
        metrics: [
          { label: 'Ulaşım', score: Math.floor(Math.random()*30+60), color: '#2563eb' },
          { label: 'Demografi', score: Math.floor(Math.random()*30+55), color: '#2563eb' },
          { label: 'Ticari Potansiyel', score: Math.floor(Math.random()*30+58), color: '#2563eb' },
          { label: 'Altyapı', score: Math.floor(Math.random()*25+65), color: '#16a34a' },
          { label: 'Risk', score: Math.floor(Math.random()*30+55), color: '#d97706' },
          { label: 'Gelişme', score: Math.floor(Math.random()*30+60), color: '#2563eb' },
        ],
        nearby: [
          { icon: '🚌', label: 'Toplu Taşıma', val: `${(Math.random()*2+0.3).toFixed(1)} km` },
          { icon: '🏥', label: 'Sağlık', val: `${(Math.random()*3+0.5).toFixed(1)} km` },
          { icon: '🏫', label: 'Eğitim', val: `${(Math.random()*3+0.5).toFixed(1)} km` },
          { icon: '🛒', label: 'Ticaret', val: `${(Math.random()*2+0.3).toFixed(1)} km` },
        ]
      };
      showParcel(mockData, `${ada}/${parsel}`);
    });
  }
}

function showParcel(data, label) {
  // Clear previous
  if (currentMarker) map.removeLayer(currentMarker);
  if (currentPolygon) map.removeLayer(currentPolygon);

  // Polygon
  currentPolygon = L.polygon(data.coords, {
    color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.25, weight: 2.5
  }).addTo(map);

  // Marker
  const icon = L.divIcon({
    className: '',
    html: `<div style="background:#ef4444;color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)">${label}</div>`,
    iconAnchor: [30, 10]
  });
  currentMarker = L.marker([data.lat, data.lng], { icon }).addTo(map);

  map.fitBounds(currentPolygon.getBounds(), { padding: [60, 60] });

  // Panel info
  showParcelInfo(data);
}

function showParcelInfo(data) {
  // Info rows
  const rows = Object.entries(data.info).map(([k,v]) =>
    `<div class="info-row"><span class="key">${k}</span><span class="val">${v}</span></div>`
  ).join('');
  document.getElementById('parcel-info-rows').innerHTML = rows;
  document.getElementById('parcel-info').classList.remove('hidden');

  // Store data for analysis
  document.getElementById('parcel-info').dataset.pending = JSON.stringify(data);
}

function analizBasla() {
  const data = JSON.parse(document.getElementById('parcel-info').dataset.pending || 'null');
  if (!data) return;

  // Metrics
  const mgrid = document.getElementById('metrics-grid');
  mgrid.innerHTML = data.metrics.map(m => `
    <div class="metric-card">
      ${svgRing(m.score, m.color)}
      <div class="metric-label">${m.label}</div>
      <div class="metric-sub" style="color:${m.color}">${m.score >= 85 ? 'Çok İyi' : m.score >= 70 ? 'İyi' : 'Orta'}</div>
    </div>
  `).join('');
  document.getElementById('analysis-section').classList.remove('hidden');

  // Nearby
  const nearby = document.getElementById('nearby-list');
  nearby.innerHTML = data.nearby.map(n => `
    <div class="info-row">
      <span class="key">${n.icon} ${n.label}</span>
      <span class="val">${n.val}</span>
    </div>
  `).join('');
  document.getElementById('nearby-section').classList.remove('hidden');

  // 1km circle overlay
  if (window._analysisCircle) map.removeLayer(window._analysisCircle);
  window._analysisCircle = L.circle([data.lat, data.lng], {
    radius: 1000, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.05, weight: 1.5, dashArray: '6,4'
  }).addTo(map);
}

function svgRing(score, color) {
  const r = 22, circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 28 28)"/>
    <text x="28" y="33" text-anchor="middle" fill="${color}" font-size="13" font-weight="700">${score}</text>
  </svg>`;
}

// ── Address search (Nominatim) ────────────────────────────────────────────
let searchTimeout;
function searchAddress(e) {
  clearTimeout(searchTimeout);
  const q = document.getElementById('search-input').value.trim();
  if (q.length < 3) { document.getElementById('search-results').classList.add('hidden'); return; }
  if (e.key === 'Enter') doSearch(q);
  else searchTimeout = setTimeout(() => doSearch(q), 600);
}

function doSearch(q) {
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ', Türkiye')}&limit=5&countrycodes=tr&accept-language=tr`)
    .then(r => r.json())
    .then(results => {
      const el = document.getElementById('search-results');
      if (!results.length) { el.classList.add('hidden'); return; }
      el.innerHTML = results.map(r =>
        `<div class="search-result-item" onclick="gotoResult(${r.lat},${r.lon},'${r.display_name.replace(/'/g,"&#39;")}')">
          📍 ${r.display_name}
        </div>`
      ).join('');
      el.classList.remove('hidden');
    })
    .catch(() => {});
}

function gotoResult(lat, lng, name) {
  map.setView([lat, lng], 16);
  L.marker([lat, lng]).addTo(map)
    .bindPopup(`<b>${name.split(',')[0]}</b><br><small>${name}</small>`).openPopup();
  document.getElementById('search-results').classList.add('hidden');
  document.getElementById('search-input').value = name.split(',')[0];
}

function geocodeAddress(q, cb) {
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
    .then(r => r.json())
    .then(results => { if (results.length) cb(parseFloat(results[0].lat), parseFloat(results[0].lon)); })
    .catch(() => cb(40.9267, 29.1200));
}

// ── Current location ──────────────────────────────────────────────────────
function konumSorgu() {
  if (!navigator.geolocation) { alert('Tarayıcı konum erişimine izin vermiyor.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    map.setView([lat, lng], 16);
    L.circleMarker([lat, lng], { radius: 10, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.4 })
      .addTo(map).bindPopup('📍 Mevcut konumunuz').openPopup();
  }, () => alert('Konum alınamadı. Tarayıcı iznini kontrol edin.'));
}

// ── Manual drawing ────────────────────────────────────────────────────────
function drawParcel() {
  if (isDrawing) { finishDraw(); return; }
  isDrawing = true;
  drawPoints = [];
  document.querySelector('[onclick="drawParcel()"]').textContent = '✅ Tamamla';
  map.getContainer().style.cursor = 'crosshair';
  map.on('click', onDrawClick);
}

function onDrawClick(e) {
  drawPoints.push([e.latlng.lat, e.latlng.lng]);
  if (drawPolyline) map.removeLayer(drawPolyline);
  drawPolyline = L.polyline(drawPoints, { color: '#2563eb', weight: 2 }).addTo(map);
  L.circleMarker(e.latlng, { radius: 5, color: '#2563eb', fillColor: '#fff', fillOpacity: 1 }).addTo(drawnItems);
}

function finishDraw() {
  if (drawPoints.length < 3) { alert('En az 3 nokta çizin.'); return; }
  isDrawing = false;
  map.off('click', onDrawClick);
  if (drawPolyline) { map.removeLayer(drawPolyline); drawPolyline = null; }
  map.getContainer().style.cursor = '';
  document.querySelector('[onclick="drawParcel()"]').textContent = '✏️ Çiz';
  const poly = L.polygon(drawPoints, { color: '#8b5cf6', fillColor: '#8b5cf6', fillOpacity: 0.2, weight: 2 }).addTo(drawnItems);
  const area = L.GeometryUtil ? L.GeometryUtil.geodesicArea(poly.getLatLngs()[0]) : 'Hesaplanıyor';
  poly.bindPopup(`<b>Çizilen Alan</b><br>${typeof area === 'number' ? Math.round(area) + ' m²' : area}`).openPopup();
}

function clearDrawing() {
  drawnItems.clearLayers();
  drawPoints = [];
  if (drawPolyline) { map.removeLayer(drawPolyline); drawPolyline = null; }
  if (window._analysisCircle) { map.removeLayer(window._analysisCircle); }
  isDrawing = false;
  map.off('click', onDrawClick);
  map.getContainer().style.cursor = '';
  document.querySelector('[onclick="drawParcel()"]').textContent = '✏️ Çiz';
}
