<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>ISDBM Digital — Argeplano</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel (JSX → JS in browser) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9}
#root{display:flex;flex-direction:column;min-height:100vh}

/* Sidebar */
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:14px;color:#475569;transition:background .15s}
.nav-item.active{background:#eff6ff;color:#2563eb;font-weight:600}
.nav-item:hover:not(.active){background:#f8fafc}

/* Topbar */
.topbar{height:52px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}

/* Cards */
.card{background:#fff;border-radius:12px;padding:20px}
.stat-card{background:#f8fafc;border-radius:10px;padding:14px 18px;flex:1;min-width:100px}

/* Buttons */
.btn{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-primary{background:#2563eb;color:#fff;width:100%}
.btn-secondary{background:#f8fafc;color:#374151;border:1px solid #e2e8f0;width:100%}

/* Form */
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;color:#64748b;font-weight:500}
.form-group input,.form-group select{padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:13px;color:#0f172a;background:#fff;outline:none;width:100%}
.form-group input:focus,.form-group select:focus{border-color:#2563eb}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:8px 12px;color:#94a3b8;font-weight:500;background:#f8fafc}
.data-table td{padding:11px 12px;border-top:1px solid #f1f5f9}
.data-table tr:hover td{background:#fafbfc;cursor:pointer}

/* Badge */
.badge{border-radius:20px;padding:2px 10px;font-weight:700;font-size:12px;display:inline-block}

/* Step wizard */
.step-circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

/* Map */
#leaflet-map{width:100%;height:100%;z-index:1}
.map-wrapper{position:relative;flex:1;min-height:400px}
.map-overlay-btns{position:absolute;top:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:6px}
.map-ol-btn{background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#374151}
.map-ol-btn.active{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.map-search-bar{position:absolute;top:10px;left:10px;z-index:999;background:#fff;border-radius:9px;border:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;padding:8px 12px;width:260px}
.map-search-bar input{border:none;outline:none;font-size:13px;flex:1;color:#0f172a}
.nominatim-results{position:absolute;top:54px;left:10px;z-index:1000;background:#fff;border-radius:9px;border:1px solid #e2e8f0;width:260px;max-height:180px;overflow-y:auto}
.nominatim-item{padding:9px 14px;font-size:12px;cursor:pointer;color:#0f172a;border-bottom:1px solid #f8fafc}
.nominatim-item:hover{background:#eff6ff;color:#2563eb}

/* Info rows */
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:13px}
.info-row .k{color:#64748b}.info-row .v{font-weight:600;color:#0f172a;text-align:right}

/* Metrics grid */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.metric-card-sm{background:#f8fafc;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .mobile-nav{display:flex!important}
}
.mobile-nav{display:none;background:#fff;border-top:1px solid #e2e8f0;flex-shrink:0}
.mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;font-size:10px;color:#64748b;cursor:pointer;gap:2px}
.mobile-nav-item.active{color:#2563eb}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Mock data ──────────────────────────────────────────────────────────────
const PROJECTS = [
  { id:1, name:"Pendik Lojistik & DC",     location:"Pendik / İstanbul", parcel:"1254 / 7",  score:89, status:"Tamamlandı", date:"20.05.2024", lat:40.9267, lng:29.1200 },
  { id:2, name:"Ankara Teknoloji Kampüsü", location:"Sincan / Ankara",   parcel:"8901 / 3",  score:82, status:"Tamamlandı", date:"18.05.2024", lat:39.9334, lng:32.8597 },
  { id:3, name:"İzmir Karma Proje",        location:"Bornova / İzmir",   parcel:"3405 / 12", score:74, status:"Devam Ediyor", date:"17.05.2024", lat:38.4237, lng:27.1428 },
  { id:4, name:"Bursa Lojistik Merkezi",   location:"Nilüfer / Bursa",   parcel:"2100 / 5",  score:81, status:"Tamamlandı", date:"15.05.2024", lat:40.2200, lng:28.9750 },
  { id:5, name:"Antalya Turizm Tesisi",    location:"Aksu / Antalya",    parcel:"1500 / 1",  score:61, status:"Devam Ediyor", date:"14.05.2024", lat:36.9081, lng:30.7900 },
];

const INV_ALTS = [
  { rank:1, name:"Data Center Campus",       icon:"🏗️", score:89, uyg:"Çok Yüksek", color:"#16a34a" },
  { rank:2, name:"Logistics Center",          icon:"🚚", score:84, uyg:"Çok Yüksek", color:"#16a34a" },
  { rank:3, name:"Technology Campus",         icon:"💻", score:80, uyg:"Yüksek",     color:"#2563eb" },
  { rank:4, name:"Mixed Use (Karma Kullanım)",icon:"🏢", score:76, uyg:"Yüksek",     color:"#2563eb" },
  { rank:5, name:"Office",                    icon:"🏬", score:68, uyg:"Orta",       color:"#d97706" },
  { rank:6, name:"Hotel",                     icon:"🏨", score:61, uyg:"Orta",       color:"#d97706" },
];

const IL_ILCE = {
  "İstanbul":["Pendik","Kadıköy","Beşiktaş","Üsküdar","Maltepe","Ataşehir"],
  "Ankara":  ["Çankaya","Keçiören","Yenimahalle","Sincan","Mamak"],
  "İzmir":   ["Bornova","Karşıyaka","Konak","Buca","Bayraklı"],
  "Bursa":   ["Nilüfer","Osmangazi","Yıldırım","Mudanya"],
  "Antalya": ["Muratpaşa","Konyaaltı","Kepez","Aksu"],
};

// ── Helpers ────────────────────────────────────────────────────────────────
const ScoreRing = ({ score, size=72, color="#2563eb" }) => {
  const r = size/2 - 7;
  const circ = 2*Math.PI*r;
  const offset = circ - (score/100)*circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth="5"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5"
        strokeDasharray={circ.toFixed(1)} strokeDashoffset={offset.toFixed(1)}
        strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x={size/2} y={size/2+5} textAnchor="middle" fill={color} fontSize="14" fontWeight="700">{score}</text>
    </svg>
  );
};

const Badge = ({ score }) => {
  const c = score>=80?"#16a34a":score>=65?"#2563eb":"#d97706";
  const bg= score>=80?"#dcfce7":score>=65?"#dbeafe":"#fef3c7";
  return <span className="badge" style={{background:bg,color:c}}>{score}</span>;
};

const InfoRow = ({ k, v }) => (
  <div className="info-row"><span className="k">{k}</span><span className="v">{v}</span></div>
);

// ── Leaflet Map Component ──────────────────────────────────────────────────
const LeafletMap = ({ projects, activeParcel, onParcelFound }) => {
  const mapRef = useRef(null);
  const leafletRef = useRef(null);
  const layersRef = useRef({});
  const markersRef = useRef([]);
  const parcelLayerRef = useRef(null);
  const circleRef = useRef(null);
  const searchRef = useRef(null);
  const [searchQ, setSearchQ] = useState('');
  const [searchResults, setSearchResults] = useState([]);
  const [activeLayer, setActiveLayer] = useState('osm');
  const [coords, setCoords] = useState('—');
  const [zoom, setZoom] = useState(6);

  useEffect(() => {
    if (leafletRef.current) return;
    const map = L.map(mapRef.current, { zoomControl: true }).setView([39.0, 35.0], 6);
    leafletRef.current = map;

    const layers = {
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:'© OpenStreetMap katkıcıları', maxZoom:19
      }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution:'© Esri', maxZoom:19
      }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution:'© OpenTopoMap', maxZoom:17
      }),
    };
    layersRef.current = layers;
    layers.osm.addTo(map);

    // Add project markers
    projects.forEach(p => {
      const color = p.score>=80?"#16a34a":p.score>=65?"#2563eb":"#d97706";
      const icon = L.divIcon({
        className:'',
        html:`<div style="background:${color};color:#fff;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)">${p.score} — ${p.name.split(' ').slice(0,2).join(' ')}</div>`,
        iconAnchor:[40,10]
      });
      const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
      m.bindPopup(`<b>${p.name}</b><br>${p.location}<br>Ada/Parsel: ${p.parcel}<br>Skor: <b>${p.score}</b>`);
      markersRef.current.push(m);
    });

    map.on('mousemove', e => setCoords(`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`));
    map.on('zoom', () => setZoom(map.getZoom()));

    return () => { map.remove(); leafletRef.current = null; };
  }, []);

  // Show active parcel from wizard
  useEffect(() => {
    if (!activeParcel || !leafletRef.current) return;
    const map = leafletRef.current;
    if (parcelLayerRef.current) map.removeLayer(parcelLayerRef.current);
    if (circleRef.current) map.removeLayer(circleRef.current);

    const { lat, lng, coords, label } = activeParcel;
    const poly = L.polygon(coords, { color:'#ef4444', fillColor:'#ef4444', fillOpacity:0.25, weight:2.5 }).addTo(map);
    parcelLayerRef.current = poly;

    const icon = L.divIcon({
      className:'',
      html:`<div style="background:#ef4444;color:#fff;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)">${label}</div>`,
      iconAnchor:[30,10]
    });
    L.marker([lat, lng], { icon }).addTo(map);
    map.fitBounds(poly.getBounds(), { padding:[60,60] });

    circleRef.current = L.circle([lat,lng], {
      radius:1000, color:'#2563eb', fillColor:'#2563eb', fillOpacity:.06, weight:1.5, dashArray:'6,4'
    }).addTo(map);
  }, [activeParcel]);

  const switchLayer = (name) => {
    const map = leafletRef.current;
    if (!map) return;
    Object.values(layersRef.current).forEach(l => { try { map.removeLayer(l); } catch(e){} });
    layersRef.current[name].addTo(map);
    setActiveLayer(name);
  };

  const doSearch = (q) => {
    if (q.length < 3) { setSearchResults([]); return; }
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+', Türkiye')}&limit=5&countrycodes=tr&accept-language=tr`)
      .then(r=>r.json()).then(res => setSearchResults(res)).catch(()=>{});
  };

  const gotoResult = (item) => {
    const map = leafletRef.current;
    if (!map) return;
    map.setView([parseFloat(item.lat), parseFloat(item.lon)], 16);
    L.marker([parseFloat(item.lat), parseFloat(item.lon)]).addTo(map)
      .bindPopup(`<b>${item.display_name.split(',')[0]}</b>`).openPopup();
    setSearchResults([]);
    setSearchQ(item.display_name.split(',')[0]);
  };

  const myLocation = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      const map = leafletRef.current;
      if (!map) return;
      const { latitude:lat, longitude:lng } = pos.coords;
      map.setView([lat,lng], 16);
      L.circleMarker([lat,lng], { radius:10, color:'#2563eb', fillColor:'#2563eb', fillOpacity:.4 })
        .addTo(map).bindPopup('📍 Mevcut konumunuz').openPopup();
    });
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
      {/* Map area */}
      <div style={{ flex:1, position:'relative' }}>
        {/* Search */}
        <div className="map-search-bar">
          <span style={{color:'#94a3b8'}}>🔍</span>
          <input value={searchQ} onChange={e=>{ setSearchQ(e.target.value); doSearch(e.target.value); }}
            placeholder="Adres, mahalle ara..." />
          <span style={{cursor:'pointer',color:'#94a3b8',fontSize:12}} onClick={myLocation}>📡</span>
        </div>
        {searchResults.length>0 && (
          <div className="nominatim-results">
            {searchResults.map((r,i)=>(
              <div key={i} className="nominatim-item" onClick={()=>gotoResult(r)}>
                📍 {r.display_name.length>60 ? r.display_name.slice(0,60)+'…' : r.display_name}
              </div>
            ))}
          </div>
        )}
        {/* Layer btns */}
        <div className="map-overlay-btns">
          {[['osm','OSM'],['satellite','Uydu'],['topo','Topo']].map(([k,l])=>(
            <button key={k} className={`map-ol-btn${activeLayer===k?' active':''}`} onClick={()=>switchLayer(k)}>{l}</button>
          ))}
        </div>
        {/* Map div */}
        <div ref={mapRef} id="leaflet-map" style={{position:'absolute',inset:0}} />
      </div>
      {/* Status bar */}
      <div style={{height:28,background:'#0f172a',color:'#94a3b8',fontSize:11,display:'flex',alignItems:'center',padding:'0 14px',gap:20,flexShrink:0}}>
        <span>Koordinat: <span style={{color:'#60a5fa'}}>{coords}</span></span>
        <span>Zoom: <span style={{color:'#60a5fa'}}>{zoom}</span></span>
        <span style={{marginLeft:'auto'}}>© OpenStreetMap | ISDBM Digital</span>
      </div>
    </div>
  );
};

// ── Main App ───────────────────────────────────────────────────────────────
const App = () => {
  const [screen, setScreen] = useState('login');
  const [loginForm, setLoginForm] = useState({ user:'', pass:'' });
  const [loginErr, setLoginErr] = useState('');
  const [wizardStep, setWizardStep] = useState(1);
  const [formData, setFormData] = useState({ il:'İstanbul', ilce:'Pendik', mahalle:'Velibaba', ada:'1254', parsel:'7' });
  const [activeParcel, setActiveParcel] = useState(null);
  const [selectedAlt, setSelectedAlt] = useState(null);
  const [activeNav, setActiveNav] = useState('dashboard');

  const ilceler = IL_ILCE[formData.il] || [];

  const NAV = [
    { key:'dashboard', label:'Dashboard',    icon:'🏠' },
    { key:'projects',  label:'Projeler',     icon:'📁' },
    { key:'map',       label:'Harita',       icon:'🗺️' },
    { key:'invest',    label:'Yatırım',      icon:'📈' },
    { key:'reports',   label:'Raporlar',     icon:'📄' },
    { key:'ai',        label:'ISDBM AI',     icon:'🤖' },
  ];

  const goNav = (key) => {
    setActiveNav(key);
    if (key==='map') setScreen('mapscreen');
    else if (key==='dashboard') setScreen('dashboard');
    else if (key==='projects') setScreen('dashboard');
  };

  const handleLogin = () => {
    if (!loginForm.user || !loginForm.pass) { setLoginErr('Kullanıcı adı ve şifre gereklidir.'); return; }
    setLoginErr(''); setScreen('dashboard'); setActiveNav('dashboard');
  };

  // ── Shell ────────────────────────────────────────────────────────────────
  const Shell = ({ children, nav }) => (
    <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
      {/* Desktop sidebar */}
      <div className="sidebar">
        <div style={{ padding:'18px 20px 12px', borderBottom:'1px solid #f1f5f9' }}>
          <div style={{ fontSize:11, color:'#94a3b8', letterSpacing:2 }}>ISDBM</div>
          <div style={{ fontSize:17, fontWeight:800 }}>Digital <span style={{ color:'#2563eb' }}>●</span></div>
        </div>
        <nav style={{ flex:1, padding:'10px 0' }}>
          {NAV.map(n=>(
            <div key={n.key} className={`nav-item${nav===n.key?' active':''}`} onClick={()=>goNav(n.key)}>
              <span style={{fontSize:16}}>{n.icon}</span> {n.label}
            </div>
          ))}
        </nav>
        <div className="nav-item" onClick={()=>setScreen('login')} style={{borderTop:'1px solid #f1f5f9'}}>
          ← Çıkış
        </div>
      </div>

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {/* Topbar */}
        <div className="topbar">
          <div style={{ fontSize:13, color:'#94a3b8', fontWeight:500 }}>
            {nav==='dashboard'&&'Dashboard'}{nav==='map'&&'Harita Analizi'}{nav==='newproject'&&'Yeni Proje'}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <span style={{fontSize:18}}>🔔</span>
            <div style={{ width:30, height:30, borderRadius:'50%', background:'#2563eb', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700 }}>HK</div>
            <div style={{ fontSize:13 }}>
              <div style={{ fontWeight:600, color:'#0f172a' }}>Hayati Küçük</div>
              <div style={{ color:'#94a3b8', fontSize:11 }}>ARGEPLANO</div>
            </div>
          </div>
        </div>

        {/* Page content */}
        <div style={{ flex:1, overflow:'auto', padding: nav==='map'?0:20, display:'flex', flexDirection:'column' }}>
          {children}
        </div>
      </div>

      {/* Mobile bottom nav */}
      <div className="mobile-nav" style={{ position:'fixed', bottom:0, left:0, right:0, zIndex:1000 }}>
        {NAV.slice(0,5).map(n=>(
          <div key={n.key} className={`mobile-nav-item${nav===n.key?' active':''}`} onClick={()=>goNav(n.key)}>
            <span style={{fontSize:20}}>{n.icon}</span>{n.label}
          </div>
        ))}
      </div>
    </div>
  );

  // ── LOGIN ────────────────────────────────────────────────────────────────
  if (screen==='login') return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <div style={{ flex:1, background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#0f172a 100%)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', color:'#fff', padding:40 }}>
        <div style={{ fontSize:12, letterSpacing:3, color:'#94a3b8', marginBottom:10 }}>ARGEPLANO</div>
        <div style={{ fontSize:42, fontWeight:800, lineHeight:1.1 }}>ISDBM<br /><span style={{color:'#3b82f6'}}>DIGITAL</span></div>
        <div style={{ marginTop:14, fontSize:13, color:'#94a3b8', letterSpacing:1 }}>INVESTMENT INTELLIGENCE PLATFORM</div>
        <div style={{ marginTop:36, fontSize:20, fontWeight:600 }}>From Parcel to<br />Investment Decision.</div>
        <div style={{ color:'#3b82f6', fontSize:13, marginTop:6 }}>Parselden Yatırım Kararına.</div>
        <div style={{ marginTop:40, fontSize:12, color:'#475569', textAlign:'center' }}>
          <div>🏗️ ISDBM Metodolojisi</div>
          <div style={{marginTop:6}}>🤖 Yapay Zeka Destekli Analiz</div>
          <div style={{marginTop:6}}>📊 Güncel ve Güvenilir Veriler</div>
        </div>
      </div>
      <div style={{ width:400, background:'#fff', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:48 }}>
        <div style={{ width:'100%', maxWidth:320 }}>
          <div style={{ fontSize:22, fontWeight:700, marginBottom:4, color:'#0f172a' }}>Hoş Geldiniz</div>
          <div style={{ fontSize:13, color:'#64748b', marginBottom:28 }}>ISDBM Digital platformuna giriş yapın.</div>
          <div className="form-group" style={{ marginBottom:14 }}>
            <label>Kullanıcı Adı</label>
            <input value={loginForm.user} onChange={e=>setLoginForm(f=>({...f,user:e.target.value}))} placeholder="Kullanıcı adınızı giriniz" />
          </div>
          <div className="form-group" style={{ marginBottom:6 }}>
            <label>Şifre</label>
            <input type="password" value={loginForm.pass} onChange={e=>setLoginForm(f=>({...f,pass:e.target.value}))} placeholder="Şifrenizi giriniz"
              onKeyDown={e=>e.key==='Enter'&&handleLogin()} />
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:20, fontSize:13 }}>
            <label style={{ display:'flex', alignItems:'center', gap:5, color:'#64748b', cursor:'pointer' }}><input type="checkbox" /> Beni hatırla</label>
            <span style={{ color:'#2563eb', cursor:'pointer' }}>Şifremi Unuttum?</span>
          </div>
          {loginErr && <div style={{ color:'#dc2626', fontSize:13, marginBottom:10 }}>{loginErr}</div>}
          <button className="btn btn-primary" onClick={handleLogin} style={{ marginBottom:10 }}>GİRİŞ YAP</button>
          <div style={{ textAlign:'center', color:'#94a3b8', fontSize:12, margin:'10px 0' }}>veya</div>
          <button className="btn btn-secondary">ARGEPLANO ÜYESİ OL</button>
          <div style={{ textAlign:'center', marginTop:20, fontSize:11, color:'#94a3b8' }}>© 2024 ARGEPLANO. Tüm hakları saklıdır.</div>
        </div>
      </div>
    </div>
  );

  // ── MAP SCREEN ───────────────────────────────────────────────────────────
  if (screen==='mapscreen') return (
    <div style={{ display:'flex', flex:1, flexDirection:'column', height:'100vh' }}>
      <Shell nav="map">
        <LeafletMap projects={PROJECTS} activeParcel={activeParcel} />
      </Shell>
    </div>
  );

  // ── DASHBOARD ────────────────────────────────────────────────────────────
  if (screen==='dashboard') return (
    <Shell nav="dashboard">
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:20, fontWeight:700 }}>Hoş Geldiniz, Hayati Küçük</div>
        <div style={{ fontSize:13, color:'#64748b' }}>Daha iyi yatırım kararları için ISDBM Digital yanınızda.</div>
      </div>

      {/* Hero banner */}
      <div style={{ background:'linear-gradient(135deg,#1e3a5f,#0f172a)', borderRadius:14, padding:'20px 24px', marginBottom:20, color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:18, fontWeight:700 }}>Doğru Lokasyon</div>
          <div style={{ fontSize:18, fontWeight:700, color:'#60a5fa' }}>Doğru Yatırım</div>
          <div style={{ fontSize:12, color:'#94a3b8', marginTop:8, maxWidth:340 }}>Adayparsel bölgenizin güncel, bölgesel analizlerini inceleyin.</div>
          <button className="btn" onClick={()=>{ setScreen('newproject'); setWizardStep(1); setActiveNav('newproject'); }}
            style={{ marginTop:14, background:'#3b82f6', color:'#fff', width:'auto', padding:'9px 18px' }}>
            + Yeni Yatırım Analizi
          </button>
        </div>
        <div style={{ fontSize:56 }}>🏙️</div>
      </div>

      {/* Stats */}
      <div style={{ display:'flex', gap:12, marginBottom:20, flexWrap:'wrap' }}>
        {[['Toplam Proje','12'],['Devam Eden','7'],['Tamamlanan','5'],['Raporlar','18'],['Ort. Skor','78/100']].map(([l,v])=>(
          <div key={l} className="stat-card" style={{ minWidth:100 }}>
            <div style={{ fontSize:11, color:'#64748b', marginBottom:4 }}>{l}</div>
            <div style={{ fontSize:22, fontWeight:700, color:'#0f172a' }}>{v}</div>
          </div>
        ))}
      </div>

      {/* Projects table */}
      <div className="card" style={{ marginBottom:20 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
          <div style={{ fontWeight:700, fontSize:15 }}>Son Projeler</div>
          <span style={{ color:'#2563eb', fontSize:13, cursor:'pointer' }}>Tüm Projeleri Gör →</span>
        </div>
        <table className="data-table">
          <thead><tr>
            <th>Proje Adı</th><th>Lokasyon</th><th style={{textAlign:'center'}}>ISDBM Skoru</th>
            <th>Durum</th><th style={{textAlign:'right'}}>Tarih</th>
          </tr></thead>
          <tbody>
            {PROJECTS.map(p=>(
              <tr key={p.id} onClick={()=>{ setActiveParcel({ lat:p.lat, lng:p.lng, label:p.parcel, coords:[[p.lat+.001,p.lng-.0015],[p.lat+.001,p.lng+.0015],[p.lat-.001,p.lng+.0015],[p.lat-.001,p.lng-.0015]] }); goNav('map'); }}>
                <td style={{fontWeight:500}}>{p.name}</td>
                <td style={{color:'#64748b'}}>{p.location}</td>
                <td style={{textAlign:'center'}}><Badge score={p.score}/></td>
                <td><span style={{fontSize:12,color:p.status==='Tamamlandı'?'#16a34a':'#d97706',fontWeight:500}}>{p.status}</span></td>
                <td style={{textAlign:'right',color:'#94a3b8'}}>{p.date}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Quick actions */}
      <div className="card">
        <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>Hızlı İşlemler</div>
        <div style={{ display:'flex', gap:10 }}>
          <button className="btn btn-primary" style={{flex:1}} onClick={()=>{ setScreen('newproject'); setWizardStep(1); }}>+ Yeni Analiz</button>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>goNav('map')}>🗺️ Harita</button>
          <button className="btn btn-secondary" style={{flex:1}}>📄 Raporlarım</button>
        </div>
      </div>
    </Shell>
  );

  // ── NEW PROJECT WIZARD ───────────────────────────────────────────────────
  if (screen==='newproject') {
    const steps = ['Lokasyon','Parsel','Analiz','Yatırım'];

    const parcelData = {
      lat:40.9267, lng:29.1200,
      label:`${formData.ada}/${formData.parsel}`,
      coords:[[40.9280,29.1170],[40.9280,29.1230],[40.9255,29.1230],[40.9255,29.1170]]
    };

    const metrics = [
      {label:'Ulaşım',score:86,color:'#16a34a'},
      {label:'Demografi',score:72,color:'#2563eb'},
      {label:'Ticari Potansiyel',score:81,color:'#16a34a'},
      {label:'Altyapı',score:89,color:'#16a34a'},
      {label:'Risk',score:74,color:'#2563eb'},
      {label:'Gelişme Potansiyeli',score:91,color:'#16a34a'},
    ];

    return (
      <Shell nav="newproject">
        <div style={{ fontSize:13, color:'#94a3b8', marginBottom:16 }}>
          <span style={{color:'#2563eb',cursor:'pointer'}} onClick={()=>{ setScreen('dashboard'); setActiveNav('dashboard'); }}>Dashboard</span> › Yeni Proje
        </div>

        {/* Step indicator */}
        <div style={{ display:'flex', alignItems:'center', marginBottom:28 }}>
          {steps.map((s,i)=>(
            <React.Fragment key={i}>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
                <div className="step-circle" style={{ background:wizardStep>i+1?'#16a34a':wizardStep===i+1?'#2563eb':'#e2e8f0', color:wizardStep>=i+1?'#fff':'#94a3b8' }}>
                  {wizardStep>i+1?'✓':i+1}
                </div>
                <div style={{ fontSize:11, color:wizardStep===i+1?'#2563eb':'#94a3b8', fontWeight:wizardStep===i+1?600:400 }}>{s}</div>
              </div>
              {i<steps.length-1 && <div style={{ flex:1, height:2, background:wizardStep>i+1?'#16a34a':'#e2e8f0', margin:'0 6px', marginBottom:20 }} />}
            </React.Fragment>
          ))}
        </div>

        {/* Step 1: Location form */}
        {wizardStep===1 && (
          <div style={{ display:'flex', gap:16, flexWrap:'wrap' }}>
            <div className="card" style={{ flex:'1 1 300px' }}>
              <div style={{ fontWeight:700, fontSize:14, marginBottom:16 }}>Proje Lokasyonu</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:10 }}>
                <div className="form-group">
                  <label>İl</label>
                  <select value={formData.il} onChange={e=>setFormData(f=>({...f,il:e.target.value,ilce:IL_ILCE[e.target.value]?.[0]||''}))}>
                    {Object.keys(IL_ILCE).map(il=><option key={il}>{il}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>İlçe</label>
                  <select value={formData.ilce} onChange={e=>setFormData(f=>({...f,ilce:e.target.value}))}>
                    {ilceler.map(i=><option key={i}>{i}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Mahalle</label>
                  <input value={formData.mahalle} onChange={e=>setFormData(f=>({...f,mahalle:e.target.value}))} />
                </div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:16 }}>
                <div className="form-group"><label>Ada</label><input value={formData.ada} onChange={e=>setFormData(f=>({...f,ada:e.target.value}))} /></div>
                <div className="form-group"><label>Parsel</label><input value={formData.parsel} onChange={e=>setFormData(f=>({...f,parsel:e.target.value}))} /></div>
              </div>
              <div style={{ display:'flex', gap:10 }}>
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>{ setActiveParcel(parcelData); goNav('map'); }}>🗺️ Haritada Göster</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>setWizardStep(2)}>Devam Et →</button>
              </div>
            </div>

            {/* Mini map in wizard */}
            <div style={{ flex:'1 1 300px', borderRadius:12, overflow:'hidden', minHeight:280, display:'flex', flexDirection:'column' }}>
              <LeafletMap projects={[]} activeParcel={wizardStep>=1?parcelData:null} />
            </div>
          </div>
        )}

        {/* Step 2: Parcel info */}
        {wizardStep===2 && (
          <div style={{ display:'flex', gap:16, flexWrap:'wrap' }}>
            <div style={{ flex:'1 1 300px', borderRadius:12, overflow:'hidden', minHeight:300, display:'flex', flexDirection:'column' }}>
              <LeafletMap projects={[]} activeParcel={parcelData} />
            </div>
            <div className="card" style={{ flex:'1 1 260px' }}>
              <div style={{ fontWeight:700, fontSize:14, marginBottom:14 }}>Parsel Bilgileri</div>
              {[['İl / İlçe',`${formData.il} / ${formData.ilce}`],['Mahalle',formData.mahalle],['Ada / Parsel',`${formData.ada} / ${formData.parsel}`],
                ['Yüzölçümü','24.850 m²'],['Niteliği','Arsa'],['Plan Durumu','Sanayi Bölgesi'],['Tapu Durumu','Özel Mülk']].map(([k,v])=>(
                <InfoRow key={k} k={k} v={v} />
              ))}
              <div style={{ display:'flex', gap:10, marginTop:16 }}>
                <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setWizardStep(1)}>← Geri</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={()=>setWizardStep(3)}>Analize Başla →</button>
              </div>
            </div>
          </div>
        )}

        {/* Step 3: Analysis */}
        {wizardStep===3 && (
          <div>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:4 }}>İlk Analiz Sonuçları</div>
            <div style={{ fontSize:13, color:'#64748b', marginBottom:18 }}>Lokasyonunuz için genel analiz sonuçları.</div>
            <div className="metrics-grid" style={{ marginBottom:18 }}>
              {metrics.map(m=>(
                <div key={m.label} className="metric-card-sm">
                  <ScoreRing score={m.score} color={m.color} />
                  <div style={{ fontSize:12, color:'#64748b', textAlign:'center' }}>{m.label}</div>
                  <div style={{ fontSize:11, color:m.color, fontWeight:600 }}>{m.score>=85?'Çok İyi':m.score>=70?'İyi':'Orta'}</div>
                </div>
              ))}
            </div>
            <div className="card" style={{ marginBottom:16 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                <span style={{fontSize:18}}>⭐</span>
                <div style={{ fontWeight:700, fontSize:13 }}>Genel Değerlendirme</div>
              </div>
              <div style={{ fontSize:13, color:'#475569' }}>Lokasyonunuz güçlü ulaşım bağlantıları, altyapı olanakları ve gelişme potansiyeli ile öne çıkmaktadır.</div>
            </div>
            <div style={{ display:'flex', gap:10, justifyContent:'flex-end' }}>
              <button className="btn btn-secondary" style={{width:'auto',padding:'10px 20px'}} onClick={()=>setWizardStep(2)}>← Geri</button>
              <button className="btn btn-primary" style={{width:'auto',padding:'10px 20px'}} onClick={()=>setWizardStep(4)}>Yatırım Fırsatları →</button>
            </div>
          </div>
        )}

        {/* Step 4: Investment alternatives */}
        {wizardStep===4 && (
          <div style={{ display:'flex', gap:16, flexWrap:'wrap' }}>
            <div style={{ flex:'2 1 400px' }}>
              <div style={{ fontWeight:700, fontSize:14, marginBottom:14 }}>Yatırım Alternatifleri</div>
              <div className="card">
                <table className="data-table">
                  <thead><tr>
                    <th>#</th><th>Yatırım Alternatifi</th><th style={{textAlign:'center'}}>ISDBM Skoru</th><th style={{textAlign:'center'}}>Uygunluk</th><th></th>
                  </tr></thead>
                  <tbody>
                    {INV_ALTS.map(alt=>(
                      <tr key={alt.rank} onClick={()=>setSelectedAlt(alt)}
                        style={{background:selectedAlt?.rank===alt.rank?'#eff6ff':'transparent'}}>
                        <td style={{color:'#94a3b8'}}>{alt.rank}</td>
                        <td><span style={{marginRight:8}}>{alt.icon}</span><span style={{fontWeight:500}}>{alt.name}</span></td>
                        <td style={{textAlign:'center'}}><Badge score={alt.score}/></td>
                        <td style={{textAlign:'center',fontSize:12,color:alt.color,fontWeight:600}}>{alt.uyg}</td>
                        <td style={{color:'#94a3b8'}}>›</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {selectedAlt && (
                <div style={{ display:'flex', gap:10, marginTop:14, justifyContent:'flex-end' }}>
                  <button className="btn btn-secondary" style={{width:'auto',padding:'10px 20px'}} onClick={()=>setWizardStep(3)}>← Geri</button>
                  <button className="btn btn-primary" style={{width:'auto',padding:'10px 24px'}} onClick={()=>setScreen('decision')}>Detaylı Analiz →</button>
                </div>
              )}
            </div>
            <div style={{ flex:'1 1 220px' }}>
              <div className="card" style={{ textAlign:'center', marginBottom:14 }}>
                <div style={{ fontSize:12, color:'#64748b', marginBottom:8 }}>GENEL ISDBM SKORU</div>
                <ScoreRing score={82} size={90} color="#2563eb" />
                <div style={{ fontSize:12, color:'#16a34a', fontWeight:600, marginTop:6 }}>Strong Investment Opportunity</div>
              </div>
              <div className="card">
                <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>Önerilen İlk 3</div>
                {INV_ALTS.slice(0,3).map(alt=>(
                  <div key={alt.rank} className="info-row">
                    <span className="k"><span style={{color:'#94a3b8',marginRight:6}}>{alt.rank}</span>{alt.name}</span>
                    <Badge score={alt.score}/>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </Shell>
    );
  }

  // ── DECISION ─────────────────────────────────────────────────────────────
  if (screen==='decision') return (
    <Shell nav="newproject">
      <div style={{ fontSize:13, color:'#94a3b8', marginBottom:16 }}>
        <span style={{color:'#2563eb',cursor:'pointer'}} onClick={()=>setScreen('dashboard')}>Dashboard</span> › Yatırım Kararı
      </div>
      <div style={{ display:'flex', gap:16, marginBottom:16, flexWrap:'wrap' }}>
        {/* Investment card */}
        <div style={{ flex:'1 1 220px', background:'linear-gradient(135deg,#0f172a,#1e3a5f)', borderRadius:14, padding:24, color:'#fff' }}>
          <div style={{ fontSize:10, background:'#16a34a', display:'inline-block', borderRadius:4, padding:'3px 8px', marginBottom:10, fontWeight:700 }}>Önerilen Yatırım</div>
          <div style={{ fontSize:18, fontWeight:800, marginBottom:4 }}>DATA CENTER CAMPUS</div>
          <div style={{ fontSize:11, color:'#94a3b8', marginBottom:16 }}>ISDBM Investment Score</div>
          <ScoreRing score={89} size={80} color="#3b82f6" />
          <div style={{ marginTop:10, fontSize:12, color:'#60a5fa', fontWeight:600 }}>Strong Investment Opportunity</div>
          <button className="btn" style={{ marginTop:18, background:'#3b82f6', color:'#fff', width:'100%' }}>📄 ISDBM Raporu Oluştur</button>
          <button className="btn" style={{ marginTop:8, background:'transparent', border:'1px solid #475569', color:'#94a3b8', width:'100%' }}>Uzmanlara Danış</button>
        </div>

        {/* Financial */}
        <div className="card" style={{ flex:'2 1 300px' }}>
          <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>Öngörülen Finansal Göstergeler</div>
          {[['Toplam Yatırım (CAPEX)','450-600 M$'],['Yıllık Gelir (Tahmini)','85-120 M$'],
            ['EBITDA Marjı','45-60%'],['ROI','12-18%'],['IRR','14-22%'],['Geri Dönüş Süresi','6-9 yıl']].map(([k,v])=>(
            <InfoRow key={k} k={k} v={v} />
          ))}
          <div style={{ marginTop:16 }}>
            <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>Aşamalı Geliştirme Stratejisi</div>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              {[['1. Faz','10 MW','0-12 ay'],['2. Faz','20 MW','12-24 ay'],['3. Faz','20 MW','24-36 ay']].map(([f,mw,s],i)=>(
                <React.Fragment key={i}>
                  <div style={{ textAlign:'center' }}>
                    <div style={{ fontSize:11, color:'#64748b', marginBottom:3 }}>{f}</div>
                    <div style={{ background:'#eff6ff', borderRadius:7, padding:'8px 12px', fontWeight:700, color:'#2563eb', fontSize:15 }}>{mw}</div>
                    <div style={{ fontSize:10, color:'#94a3b8', marginTop:3 }}>{s}</div>
                  </div>
                  {i<2&&<span style={{color:'#16a34a',fontSize:16}}>→</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Report summary */}
      <div className="card">
        <div style={{ fontWeight:700, fontSize:14, marginBottom:14 }}>Rapor Özeti</div>
        <div style={{ display:'flex', gap:16, flexWrap:'wrap' }}>
          <div style={{ flex:'1 1 200px', background:'#f8fafc', borderRadius:10, padding:20, textAlign:'center' }}>
            <div style={{ fontSize:36, marginBottom:8 }}>📋</div>
            <div style={{ fontWeight:700, color:'#0f172a', fontSize:13 }}>ISDBM INVESTMENT ANALYSIS REPORT</div>
            <div style={{ fontSize:12, color:'#64748b', marginTop:4 }}>Pendik / İstanbul – 1254/7</div>
          </div>
          <div style={{ flex:'2 1 260px' }}>
            {[['Rapor Adı','Pendik Data Center Campus'],['Lokasyon','Pendik / İstanbul'],
              ['Parsel','1254 / 7'],['Rapor Tarihi','12.04.2025'],['Rapor Türü','ISDBM Yatırım Ön Değerlendirme']].map(([k,v])=>(
              <InfoRow key={k} k={k} v={v} />
            ))}
            <div style={{ display:'flex', gap:10, marginTop:14 }}>
              <button className="btn btn-primary" style={{flex:2}}>📥 Raporu İndir (PDF)</button>
              <button className="btn btn-secondary" style={{flex:1}}>Paylaş</button>
            </div>
          </div>
        </div>
      </div>
    </Shell>
  );

  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
