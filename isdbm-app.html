// ── CAPEX Formül Motoru ──────────────────────────────────────────────────
// CAPEX = Alan(m²) × Emsal × BirimMaliyet(₺/m²) × LokasyonKatsayısı × İnşaatSınıfıKatsayısı
function calcCapex(t, parcel, ov={}) {
  const alan   = ov.alan   ?? (Number(parcel?.alan)      || 5000);
  const emsal  = ov.emsal  ?? (t.emsalDef                || 1.0);
  const birim  = ov.birim  ?? (BIRIM_MALIYET[t.birimKey] || 12000);
  const lokKat = ov.lokKat ?? (LOKASYON_KAT[parcel?.il]  || 1.0);
  const insKat = ov.insKat ?? (t.insaatKat               || 1.0);
  const kur    = ov.kur    ?? 38;
  const insAlan = alan * emsal;
  const tl  = Math.round(insAlan * birim * lokKat * insKat);
  const usd = Math.round(tl / kur);
  return {tl, usd, insAlan, alan, emsal, birim, lokKat, insKat, kur};
}

function fmtMoney(tl, usd) {
  const f = n => n>=1e9?`${(n/1e9).toFixed(2)}B`:n>=1e6?`${(n/1e6).toFixed(1)}M`:n>=1e3?`${(n/1e3).toFixed(0)}K`:String(n);
  return {tlStr:`${f(tl)} ₺`, usdStr:`${f(usd)} $`, combined:`${f(tl)} ₺ / ${f(usd)} $`};
}

// Nüfus verisi al — önce OSM dene, sonra statik JSON
async function fetchNufusData(lat, lng, il, ilce) {
  // 1) OSM Overpass — population tag
  const query=`[out:json][timeout:10];
(
  relation["name"="${ilce}"]["admin_level"="7"](around:30000,${lat},${lng});
  relation["name"="${ilce}"]["admin_level"="8"](around:30000,${lat},${lng});
  relation["name"="${il}"]["admin_level"="4"];
);
out tags;`;
  try {
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
    const d=await r.json();
    let osmIlNufus=null, osmIlceNufus=null, osmMahalleNufus=null;
    d.elements?.forEach(el=>{
      const pop=parseInt(el.tags?.population||"0");
      if(!pop) return;
      if(el.tags?.name===il) osmIlNufus=pop;
      if(el.tags?.name===ilce) osmIlceNufus=pop;
    });
    if(osmIlNufus||osmIlceNufus){
      return {
        il: osmIlNufus||TUIK_NUFUS[il]?.il||null,
        ilce: osmIlceNufus||TUIK_NUFUS[il]?.ilceler?.[ilce]||null,
        mahalle: osmMahalleNufus||null,
        kaynak: osmIlNufus?"OSM+TÜİK":"TÜİK(OSM kısmi)",
      };
    }
  } catch(e) {}

  // 2) Statik TÜİK JSON fallback
  const ilData=TUIK_NUFUS[il];
  if(ilData) {
    return {
      il: ilData.il||null,
      ilce: ilData.ilceler?.[ilce]||null,
      mahalle: null,
      kaynak:"TÜİK ADNKS 2023",
    };
  }
  return null;
}

function calcISDBM(m){
  return Math.round(METRICS.reduce((s,mt)=>s+(m[mt.key]||50)*mt.weight,0));
}
function calcAlts(m, parcel, ov={}){
  const PLAN_ZORUNLU={
    "Konut Bölgesi":"Konut Projesi",
    "Ticaret Bölgesi":"Ticari Ofis",
    "Karma Kullanım":"Karma Kullanım",
    "Turizm Bölgesi":"Otel / Turizm",
    "Ticaret+Turizm":"Karma Kullanım",
    "Ekoturizm Alanı":"Otel / Turizm",
    "Lojistik Bölgesi":"Lojistik Merkezi",
    "Sanayi Bölgesi":"Endüstriyel Tesis",
  };
  const base=calcISDBM(m);
  const zorunluAd=PLAN_ZORUNLU[parcel?.planDurumu||""]||null;
  const scored=INV_TEMPLATES.map(t=>{
    let bonus=0;
    Object.entries(t.scoreBonus).forEach(([k,w])=>{bonus+=((m[k]||50)-50)*w;});
    const score=Math.min(100,Math.max(0,Math.round(base+bonus)));
    const uyg=score>=85?"Çok Yüksek":score>=75?"Yüksek":score>=60?"Orta":"Düşük";
    const uygColor=score>=85?"#16a34a":score>=75?"#2563eb":score>=60?"#d97706":"#ef4444";
    const zorunlu=zorunluAd&&t.name===zorunluAd;
    return{...t,score,uyg,uygColor,zorunlu};
  });
  const zorunluItem=zorunluAd?scored.find(t=>t.name===zorunluAd):null;
  const diger=scored.filter(t=>!zorunluAd||t.name!==zorunluAd).sort((a,b)=>b.score-a.score);
  return zorunluItem?[zorunluItem,...diger]:diger;
}
function scoreColor(s){return s>=85?"#16a34a":s>=75?"#2563eb":s>=60?"#d97706":"#ef4444";}
function scoreLabel(s){return s>=85?"Mükemmel Fırsat":s>=75?"Güçlü Fırsat":s>=60?"Orta Potansiyel":"Düşük Potansiyel";}

// Polygon area in m²
function polyArea(coords){
  if(!coords||coords.length<3)return 0;
  let a=0;
  for(let i=0,j=coords.length-1;i<coords.length;j=i++){
    const xi=coords[i][1]*Math.PI/180*6371000;
    const yi=coords[i][0]*Math.PI/180*6371000;
    const xj=coords[j][1]*Math.PI/180*6371000;
    const yj=coords[j][0]*Math.PI/180*6371000;
    a+=(xj+xi)*(yj-yi);
  }
  return Math.abs(a/2);
}

async function fetchPOI(lat,lng,radius=1500){
  const query=`[out:json][timeout:20];
(
  node["amenity"~"school|hospital|clinic|pharmacy|doctors|bank|atm|supermarket|bus_station|ferry_terminal|townhall|courthouse|police|fire_station|post_office|embassy|restaurant|cafe|cinema|theatre|stadium|fuel|parking|place_of_worship"](around:${radius},${lat},${lng});
  node["shop"~"supermarket|mall|department_store"](around:${radius},${lat},${lng});
  node["tourism"~"hotel|motel|hostel"](around:${radius},${lat},${lng});
  node["leisure"~"park|stadium|sports_centre"](around:${radius},${lat},${lng});
  node["railway"~"station|halt|tram_stop"](around:${radius},${lat},${lng});
  node["highway"="motorway_junction"](around:${radius},${lat},${lng});
  node["amenity"="ferry_terminal"](around:${radius},${lat},${lng});
);
out body;`;
  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
    const d=await r.json();
    const seen=new Set();
    const results=[];
    for(const e of d.elements){
      const t=e.tags||{};
      const rawType=t.amenity||t.shop||t.tourism||t.leisure||t.railway||t.highway||"other";
      const name=t.name||t.amenity||t.shop||t.tourism||t.railway||"Tesis";
      const key=name+rawType;
      if(seen.has(key)) continue;
      seen.add(key);
      const eLat=e.lat;
      const eLng=e.lon;
      if(!eLat||!eLng) continue;
      const dist=Math.round(Math.sqrt(
        Math.pow((eLat-lat)*111000,2)+
        Math.pow((eLng-lng)*111000*Math.cos(lat*Math.PI/180),2)
      ));
      results.push({
        name,
        type:rawType,
        kategori:POI_KATEGORI[rawType]||"Diğer",
        icon:POI_IKONLAR[rawType]||"📍",
        lat:eLat,lng:eLng,dist,
      });
    }
    // Kategori ve mesafeye göre sırala, max 30
    return results.sort((a,b)=>a.dist-b.dist).slice(0,30);
  }catch(e){console.error("POI fetch error",e);return[];}
}

// ── Nominatim reverse geocode ─────────────────────────────────────────────
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=tr&zoom=16`);
    const d=await r.json();
    const a=d.address||{};
    return{
      il:a.province||a.state||a.city||"",
      ilce:a.county||a.city_district||a.district||a.town||a.municipality||a.suburb||"",
      mahalle:a.neighbourhood||a.quarter||a.village||a.hamlet||"",
      postakodu:a.postcode||"",
      display:d.display_name||"",
    };
  }catch{return{};}
}

// ── Map Component ──────────────────────────────────────────────────────────
const MapFull=({parcels,onParcelSaved,onDrawnCoords,drawMode,setDrawMode,flyTo})=>{
  const mapRef=useRef(null),leafRef=useRef(null),layersRef=useRef({});
  const drawnPtsRef=useRef([]),drawnMarkersRef=useRef([]),drawnPolyRef=useRef(null);
  const parcelLayersRef=useRef([]),circleRef=useRef(null);
  const [searchQ,setSearchQ]=useState(""),[results,setResults]=useState([]);
  const [activeLayer,setActiveLayer]=useState("osm");
  const [coords,setCoords]=useState("—"),[zoom,setZoom]=useState(6);
  const [drawPts,setDrawPts]=useState(0);
  const [loadingPOI,setLoadingPOI]=useState(false);
  const [show3D,setShow3D]=useState(false);

  useEffect(()=>{
    if(leafRef.current)return;
    const map=L.map(mapRef.current,{zoomControl:true}).setView([39.0,35.0],6);
    leafRef.current=map;
    const layers={
      osm:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}),
      satellite:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"© Esri",maxZoom:19}),
      topo:L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{attribution:"© OpenTopoMap",maxZoom:17}),
    };
    layersRef.current=layers;
    layers.osm.addTo(map);
    map.on("mousemove",e=>setCoords(`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`));
    map.on("zoom",()=>setZoom(map.getZoom()));
    return()=>{map.remove();leafRef.current=null;};
  },[]);

  // Draw click handler
  useEffect(()=>{
    const map=leafRef.current; if(!map)return;
    const handler=async(e)=>{
      if(!drawMode)return;
      const pt=[e.latlng.lat,e.latlng.lng];
      drawnPtsRef.current=[...drawnPtsRef.current,pt];
      // Marker
      const m=L.circleMarker(e.latlng,{radius:6,color:"#ef4444",fillColor:"#fff",fillOpacity:1,weight:2}).addTo(map);
      drawnMarkersRef.current.push(m);
      // Update polyline preview
      if(drawnPolyRef.current)map.removeLayer(drawnPolyRef.current);
      if(drawnPtsRef.current.length>1){
        drawnPolyRef.current=L.polygon(drawnPtsRef.current,{color:"#ef4444",fillColor:"#ef4444",fillOpacity:.15,weight:2,dashArray:"6,3"}).addTo(map);
      }
      setDrawPts(drawnPtsRef.current.length);
    };
    map.on("click",handler);
    return()=>map.off("click",handler);
  },[drawMode]);

  // Finish draw
  const finishDraw=useCallback(async()=>{
    const pts=drawnPtsRef.current;
    if(pts.length<3){alert("En az 3 nokta işaretleyin.");return;}
    const map=leafRef.current;
    // Clean preview
    drawnMarkersRef.current.forEach(m=>map.removeLayer(m));
    drawnMarkersRef.current=[];
    if(drawnPolyRef.current){map.removeLayer(drawnPolyRef.current);drawnPolyRef.current=null;}

    // Final polygon
    const poly=L.polygon(pts,{color:"#ef4444",fillColor:"#ef4444",fillOpacity:.2,weight:2.5}).addTo(map);
    const center=poly.getBounds().getCenter();
    const area=Math.round(polyArea(pts));

    // Reverse geocode
    const geo=await reverseGeocode(center.lat,center.lng);

    // 1km circle
    if(circleRef.current)map.removeLayer(circleRef.current);
    circleRef.current=L.circle([center.lat,center.lng],{radius:1000,color:"#2563eb",fillColor:"#2563eb",fillOpacity:.04,weight:1.5,dashArray:"6,4"}).addTo(map);

    // POI fetch
    setLoadingPOI(true);
    const pois=await fetchPOI(center.lat,center.lng);
    setLoadingPOI(false);

    const parcelData={
      id:Date.now(),
      lat:center.lat,lng:center.lng,
      coords:pts,
      alan:area,
      geo,
      pois,
      il:geo.il||"",
      ilce:geo.ilce||"",
      mahalle:geo.mahalle||"",
      ada:"",parsel:"",
      projeAdi:"",
      planDurumu:"Belirsiz",
      mevcutKullanim:"Boş Arsa",
      metrics:{ulasim:60,demografi:60,ticari:60,altyapi:60,risk:60,gelisme:60},
      score:0,
      tarih:new Date().toLocaleDateString("tr-TR"),
      status:"Taslak",
    };

    map.fitBounds(poly.getBounds(),{padding:[40,40]});

    // Reset draw state
    drawnPtsRef.current=[];
    setDrawPts(0);
    setDrawMode(false);

    onParcelSaved(parcelData,poly);
  },[onParcelSaved,setDrawMode]);

  const cancelDraw=useCallback(()=>{
    const map=leafRef.current; if(!map)return;
    drawnMarkersRef.current.forEach(m=>map.removeLayer(m));
    drawnMarkersRef.current=[];
    if(drawnPolyRef.current){map.removeLayer(drawnPolyRef.current);drawnPolyRef.current=null;}
    drawnPtsRef.current=[];
    setDrawPts(0);
    setDrawMode(false);
  },[setDrawMode]);

  // Show saved parcels on map
  useEffect(()=>{
    const map=leafRef.current; if(!map)return;
    parcelLayersRef.current.forEach(l=>map.removeLayer(l));
    parcelLayersRef.current=[];
    parcels.forEach(p=>{
      if(!p.coords||p.coords.length<3)return;
      const c=scoreColor(p.score||0);
      const poly=L.polygon(p.coords,{color:c,fillColor:c,fillOpacity:.18,weight:2}).addTo(map);
      const ic=L.divIcon({className:"",html:`<div style="background:${c};color:#fff;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap">${p.projeAdi||p.ada||"Arsa"} — ${p.score||"?"}</div>`,iconAnchor:[40,10]});
      const mk=L.marker([p.lat,p.lng],{icon:ic}).addTo(map);
      mk.bindPopup(`<b>${p.projeAdi||"İsimsiz Arsa"}</b><br>${p.il} / ${p.ilce}<br>Alan: ${(p.alan||0).toLocaleString("tr-TR")} m²<br>ISDBM: <b>${p.score||"—"}</b>`);
      parcelLayersRef.current.push(poly,mk);
    });
  },[parcels]);

  // Fly to
  useEffect(()=>{
    if(!flyTo||!leafRef.current)return;
    leafRef.current.setView([flyTo.lat,flyTo.lng],16);
  },[flyTo]);

  const switchLayer=name=>{
    const map=leafRef.current; if(!map)return;
    Object.values(layersRef.current).forEach(l=>{try{map.removeLayer(l);}catch(e){}});
    layersRef.current[name].addTo(map);
    setActiveLayer(name);
  };

  const doSearch=q=>{
    if(q.length<3){setResults([]);return;}
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+", Türkiye")}&limit=6&countrycodes=tr&accept-language=tr`)
      .then(r=>r.json()).then(setResults).catch(()=>{});
  };
  const gotoResult=item=>{
    const map=leafRef.current; if(!map)return;
    map.setView([+item.lat,+item.lon],16);
    setResults([]);setSearchQ(item.display_name.split(",")[0]);
  };

  if(show3D) return <View3D parcels={parcels} onClose={()=>{
    setShow3D(false);
    setTimeout(()=>{if(leafRef.current)leafRef.current.invalidateSize();},100);
  }}/>;
  return <div style={{flex:1,display:"flex",flexDirection:"column"}}>
    <div style={{flex:1,position:"relative",minHeight:400}}>
      {/* Search */}
      <div className="map-search">
        <span style={{color:"#94a3b8",fontSize:16}}>🔍</span>
        <input value={searchQ} onChange={e=>{setSearchQ(e.target.value);doSearch(e.target.value);}} placeholder="Adres, mahalle, ilçe ara..."/>
        {searchQ&&<span style={{cursor:"pointer",color:"#94a3b8",fontSize:12}} onClick={()=>{setSearchQ("");setResults([]);}}>✕</span>}
      </div>
      {results.length>0&&<div className="nom-results">
        {results.map((r,i)=><div key={i} className="nom-item" onClick={()=>gotoResult(r)}>📍 {r.display_name.length>60?r.display_name.slice(0,60)+"…":r.display_name}</div>)}
      </div>}

      {/* Layer buttons */}
      <div style={{position:"absolute",top:10,right:10,z:999,display:"flex",flexDirection:"column",gap:6,zIndex:999}}>
        {[["osm","🗺️ OSM"],["satellite","🛰️ Uydu"],["topo","📊 Topo"]].map(([k,l])=>(
          <button key={k} className={`map-fab${activeLayer===k?" active":""}`} onClick={()=>switchLayer(k)} style={{top:"auto",right:"auto",position:"relative"}}>{l}</button>
        ))}
      </div>

      {/* Draw controls */}
      <div style={{position:"absolute",bottom:50,right:10,zIndex:999,display:"flex",flexDirection:"column",gap:6}}>
        {!drawMode&&<><button className="map-fab" onClick={()=>setShow3D(true)} style={{position:"relative",background:"#7c3aed",color:"#fff",border:"none"}}>🏙️ 3D</button><button className="map-fab" onClick={()=>setDrawMode(true)} style={{position:"relative",background:"#2563eb",color:"#fff",border:"none"}}>✏️ Parsel Çiz</button></>}
        {drawMode&&<>
          <button className="map-fab" style={{position:"relative",background:"#16a34a",color:"#fff",border:"none"}} onClick={finishDraw} disabled={drawPts<3}>

    </div>
    <div className="statusbar">
      <span>Koordinat: <span style={{color:"#60a5fa"}}>{coords}</span></span>
      <span>Zoom: <span style={{color:"#60a5fa"}}>{zoom}</span></span>
      <span style={{marginLeft:"auto"}}>© OpenStreetMap | ISDBM Digital</span>
    </div>
  </div>;
};


// Finansman verisini PDF için hazırla
function buildFinansmanForPDF(capex, ozkaynakOran, krediFaiz, krediVade, yillikGetiriOran, moic, irr, breakEvenYil) {
  const fmt=n=>{
    if(!n&&n!==0) return '-';
    const a=Math.abs(n),s=n<0?'-':'';
    return s+(a>=1e9?(a/1e9).toFixed(1)+'B TL':a>=1e6?(a/1e6).toFixed(1)+'M TL':a>=1e3?(a/1e3).toFixed(0)+'K TL':Math.round(a)+' TL');
  };
  if(!capex||capex<=0) return {
    capexStr:'-',ozkaynakStr:'-',krediStr:'-',
    ozkaynakOran:ozkaynakOran||30,faiz:krediFaiz||40,vade:krediVade||10,
    aylikGetiriStr:'-',aylikTaksitStr:'-',aylikNet:0,aylikNetStr:'-',
    moic:moic||'—',irr:irr||'—',geriDonus:'—',breakEven:breakEvenYil||'—',
  };
  const ozk=Math.round(capex*(ozkaynakOran/100));
  const krd=capex-ozk;
  const ayr=krediFaiz/100/12;
  const ay=krediVade*12;
  const taksit=krd>0&&ayr>0
    ?Math.round(krd*(ayr*Math.pow(1+ayr,ay))/(Math.pow(1+ayr,ay)-1))
    :krd>0?Math.round(krd/(ay||1)):0;
  const getiriYil=Math.round(capex*(yillikGetiriOran/100));
  const getiri=Math.round(getiriYil/12);
  const net=getiri-taksit;
  // MOIC: toplam dağıtım / özkaynak
  const projYilPDF=Math.min(35,Math.max(10,krediVade+5));
  const toplamDagilim=getiriYil*projYilPDF+Math.round(capex*(1+(yillikGetiriOran/100)*projYilPDF*0.3));
  const moicCalc=ozk>0?(toplamDagilim/ozk).toFixed(2):'—';
  // IRR basit yaklaşım
  const irrCalc=moic||moicCalc;
  const geriDonus=net>0?((capex/(net*12)).toFixed(1)):'—';
  return {
    capexStr:fmt(capex), ozkaynakStr:fmt(ozk), krediStr:fmt(krd),
    ozkaynakOran, faiz:krediFaiz, vade:krediVade,
    aylikGetiriStr:fmt(getiri), aylikTaksitStr:fmt(taksit),
    aylikNet:net, aylikNetStr:fmt(net),
    moic:moic||moicCalc,
    irr:irr||'Hes.',
    geriDonus:geriDonus,
    breakEven:breakEvenYil||'—',
  };
}

// Türkçe karakter dönüşüm tablosu (jsPDF helvetica Türkçe desteklemez)
function trFix(s){
  if(!s) return '';
  return String(s)
    .replace(/ğ/g,'gh').replace(/Ğ/g,'Gh')
    .replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S')
    .replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O')
    .replace(/ç/g,'c').replace(/Ç/g,'C')
    .replace(/â/g,'a').replace(/Â/g,'A')
    .replace(/î/g,'i').replace(/û/g,'u');
}

// ── Finansman Hesap Motoru ─────────────────────────────────────────────────
const FinansmanHesap=({alt,parcel})=>{
  const parseROIMid=(str)=>{
    if(!str)return 12;
    const nums=str.replace(/[^0-9\-\.]/g,'').split('-').map(Number).filter(Boolean);
    return nums.length>1?(nums[0]+nums[1])/2:nums[0]||12;
  };

  // CAPEX override state — STRING olarak tutulur, input donmaması için
  const [emsalStr, setEmsalStr]=useState(String(alt?.emsalDef||1.0));
  const [birimStr, setBirimStr]=useState(String(BIRIM_MALIYET[alt?.birimKey]||12000));
  const [kurStr,   setKurStr  ]=useState('38');
  const [showCapexDetail, setShowCapexDetail]=useState(false);

  // Parse sadece hesaplama için
  const emsalOv = parseFloat(emsalStr)||alt?.emsalDef||1.0;
  const birimOv = parseFloat(birimStr)||BIRIM_MALIYET[alt?.birimKey]||12000;
  const kurOv   = parseFloat(kurStr)||38;

  // Dinamik CAPEX — her render'da hesaplanır, state gerekmez
  const capexCalc = alt ? calcCapex(alt, parcel, {emsal:emsalOv, birim:birimOv, kur:kurOv}) : {tl:50000000, usd:1315789};

  // capex finansman hesabı için — capexCalc.tl kullan, ayrı state gerekmez
  const [capexManuel, setCapexManuel]=useState(null); // kullanıcı override edebilir
  const capex = capexManuel ?? capexCalc.tl;
  const [ozkaynakStr,setOzkaynakStr]=useState('30');
  const ozkaynakOran=Math.max(0,Math.min(100,parseInt(ozkaynakStr)||30));
  const [krediVadeStr,setKrediVadeStr]=useState('10');
  const krediVade=Math.max(1,Math.min(30,parseInt(krediVadeStr)||10));
  const [krediFaizStr,setKrediFaizStr]=useState('40');
  const [getiriStr,setGetiriStr]=useState(()=>String(parseROIMid(alt?.roi)));
  const krediFaiz=parseFloat(krediFaizStr)||40;
  const yillikGetiriOran=parseFloat(getiriStr)||12;
  const [activeTab,setActiveTab]=useState('ozet');

  const ozkaynakTutar=Math.round(capex*(ozkaynakOran/100));
  const krediTutar=capex-ozkaynakTutar;
  const aylikFaizOran=krediFaiz/100/12;
  const toplamAy=krediVade*12;
  const aylikTaksit=krediTutar>0&&aylikFaizOran>0
    ?Math.round(krediTutar*(aylikFaizOran*Math.pow(1+aylikFaizOran,toplamAy))/(Math.pow(1+aylikFaizOran,toplamAy)-1))
    :krediTutar>0?Math.round(krediTutar/toplamAy):0;

  const yillikGetiriTutar=Math.round(capex*(yillikGetiriOran/100));
  const aylikGetiri=Math.round(yillikGetiriTutar/12);
  const aylikNet=aylikGetiri-aylikTaksit;
  const toplamFaiz=Math.max(0,aylikTaksit*toplamAy-krediTutar);
  const geriDonus=aylikNet>0?(capex/(aylikNet*12)).toFixed(1):"—";
  const ozROI=ozkaynakTutar>0?((yillikGetiriTutar-aylikTaksit*12)/ozkaynakTutar*100).toFixed(1):yillikGetiriOran;

  // Projeksiyon: kredi vadesi + 5 yıl sonrası (en az 10, en fazla 35)
  const projYil=Math.min(35, Math.max(10, krediVade+5));
  // PDF için finansman state'ini global'e kaydet
  useEffect(()=>{
    window._lastFinansman={
      capex, ozkaynakOran, krediFaiz, krediVade, yillikGetiriOran,
      moic, irr, breakEvenYil,
    };
  });
  const projeksiyon=Array.from({length:projYil},(_,i)=>{
    const y=i+1;
    const taksit=y<=krediVade?aylikTaksit*12:0;
    const net=yillikGetiriTutar-taksit;
    const kumulatif=(yillikGetiriTutar*y)-(Math.min(y,krediVade)*aylikTaksit*12);
    // Pro-Forma: kümülatif dağıtım (nakit akışı + çıkış değeri)
    const exitDeger=y===projYil?Math.round(capex*(1+(yillikGetiriOran/100)*y*0.3)):0;
    const toplamDagilim=yillikGetiriTutar+(y===projYil?exitDeger:0);
    return {y,getiri:yillikGetiriTutar,taksit,net,kumulatif,exitDeger,toplamDagilim};
  });

  // ── Pro-Forma Motor (pro-forma-investment-engine repo mantığı) ────────────
  // MOIC: Toplam Dağıtım / Özkaynak Yatırımı
  const toplamDagilim = projeksiyon.reduce((s,r)=>s+r.getiri,0) + Math.round(capex*(1+(yillikGetiriOran/100)*projYil*0.3));
  const moic = ozkaynakTutar>0 ? (toplamDagilim/ozkaynakTutar).toFixed(2) : "—";
  const netKar = toplamDagilim - ozkaynakTutar;

  // IRR: Newton-Raphson yöntemiyle NPV=0 çözümü
  // Nakit akışları: -özkaynak (yıl0), +yıllık net (yıl1..n), +exit (son yıl)
  const irrCashflows = [
    -ozkaynakTutar,
    ...projeksiyon.map((r,i)=>r.net+(i===projeksiyon.length-1?Math.round(capex*(1+(yillikGetiriOran/100)*projYil*0.3)):0))
  ];
  function calcNPV(rate, cfs) {
    return cfs.reduce((npv,cf,t)=>npv+cf/Math.pow(1+rate,t),0);
  }
  function calcIRR(cfs) {
    let rate=0.1;
    for(let i=0;i<100;i++){
      const npv=calcNPV(rate,cfs);
      const dNpv=cfs.reduce((s,cf,t)=>t===0?s:s-t*cf/Math.pow(1+rate,t+1),0);
      if(Math.abs(dNpv)<1e-10) break;
      const newRate=rate-npv/dNpv;
      if(Math.abs(newRate-rate)<1e-6) { rate=newRate; break; }
      rate=newRate;
    }
    return isFinite(rate)&&rate>-1&&rate<10 ? (rate*100).toFixed(1) : "—";
  }
  const irr = calcIRR(irrCashflows);

  // Break-even yılı (kümülatif pozitife geçiş)
  const breakEvenYil = projeksiyon.find(r=>r.kumulatif>=0)?.y || "—";

  // Waterfall tiers (Pro-Forma equity waterfall mantığı)
  const waterfallTiers = [
    { tier:"1. Sermaye İadesi", hedef:ozkaynakTutar, aciklama:"Özkaynak geri dönüşü" },
    { tier:"2. Tercihli Getiri", hedef:Math.round(ozkaynakTutar*0.08*projYil), aciklama:"%8 yıllık tercihli getiri" },
    { tier:"3. Kâr Paylaşımı", hedef:Math.max(0,netKar-Math.round(ozkaynakTutar*0.08*projYil)), aciklama:"Kalan kâr (yatırımcı + sponsor)" },
  ];

  const fmt=n=>{
    const abs=Math.abs(n);
    const s=n<0?'-':'';
    if(abs>=1000000000)return s+(abs/1000000000).toFixed(1)+'B ₺';
    if(abs>=1000000)return s+(abs/1000000).toFixed(1)+'M ₺';
    if(abs>=1000)return s+(abs/1000).toFixed(0)+'K ₺';
    return s+abs.toLocaleString('tr-TR')+' ₺';
  };
  const fmtSign=n=>(n>=0?'+':'')+fmt(n);
  const c=n=>n>=0?'#16a34a':'#ef4444';

  return <div style={{background:'#fff',borderRadius:14,padding:20,border:'1.5px solid #e2e8f0'}}>
    <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>💰 Finansman & Nakit Akışı Analizi</div>
    <div style={{fontSize:11,color:'#64748b',marginBottom:4}}>

    </div>
    <div style={{fontSize:10,color:'#94a3b8',marginBottom:14,display:'flex',gap:12,flexWrap:'wrap'}}>

      <span>📊 Baz: Çevre Bak. 2024 × TÜİK EKFE ekstrapolasyon (%31.9)</span>
    </div>

    {/* CAPEX Formül Özeti — her zaman görünür */}
    <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'12px 14px',marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:12,fontWeight:700,color:'#374151'}}>📐 CAPEX Formül Hesabı</div>
          <div style={{fontSize:11,color:'#64748b',marginTop:2}}>
            {Number(parcel?.alan||0).toLocaleString('tr-TR')} m² × Emsal {emsalOv} × {birimOv.toLocaleString('tr-TR')} ₺/m² × Lokasyon {LOKASYON_KAT[parcel?.il]||1.0}x × {alt?.insaatKat||1.0}x ({alt?.sinif||'?'} sınıf)
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:16,fontWeight:800,color:'#0f172a'}}>{fmtMoney(capexCalc.tl,capexCalc.usd).combined}</div>
          <div style={{fontSize:10,color:'#94a3b8'}}>İnşaat alanı: {Math.round(capexCalc.insAlan||0).toLocaleString('tr-TR')} m²</div>
        </div>
      </div>
      <button style={{marginTop:8,fontSize:11,color:'#2563eb',background:'none',border:'none',cursor:'pointer',padding:0}}
        onClick={()=>setShowCapexDetail(v=>!v)}>
        {showCapexDetail?'▲ Gizle':'▼ Formül detayını göster'}
      </button>
      {showCapexDetail&&<div style={{marginTop:10,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
        {/* Sadece okunur kutular */}
        {[
          ['📐 Parsel Alanı',`${Number(parcel?.alan||0).toLocaleString('tr-TR')} m²`,false],

          <span style={{fontSize:10,color:'#64748b',fontWeight:400,marginLeft:8}}>({Math.round(capexCalc.insAlan||0).toLocaleString('tr-TR')} m² inşaat)</span>

            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#94a3b8',marginTop:2}}>
              <span>%0</span>
              <span style={{color:'#16a34a',fontWeight:600}}>Özkaynak: {fmt(ozkaynakTutar)} · Kredi: {fmt(krediTutar)}</span>
              <span>%100</span>
            </div>
          </div>
          <div>
            <label style={{fontSize:11,color:'#64748b',display:'block',marginBottom:4}}>Kredi Vadesi</label>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="range" min="1" max="30" value={krediVade}
                onChange={e=>setKrediVadeStr(e.target.value)} style={{flex:1}}/>
              <input type="number" value={krediVadeStr} min="1" max="30"
                onChange={e=>setKrediVadeStr(e.target.value)}
                style={{width:52,padding:'5px 6px',border:'1.5px solid #e2e8f0',borderRadius:6,fontSize:13,fontWeight:700,textAlign:'center'}}/>
              <span style={{fontSize:11,color:'#64748b',flexShrink:0}}>yıl</span>

            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#94a3b8',marginTop:2}}>
              <span>1 yıl</span>

              <span>30 yıl</span>
            </div>
          </div>
        </div>
      </div>
    </div>}

    {/* Özet */}
    {activeTab==='ozet'&&<div>
      {/* Finansman yapısı */}
      <div style={{background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',fontSize:12}}>
        <span>⏱️ Vade: <b style={{color:'#2563eb'}}>{krediVade} yıl</b></span>

        <button onClick={()=>setActiveTab('parametreler')}

      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
        {[['Toplam CAPEX',fmt(capex),'#0f172a'],['Özkaynak (%'+ozkaynakOran+')',fmt(ozkaynakTutar),'#2563eb'],['Banka Kredisi',fmt(krediTutar),'#ef4444']].map(([l,v,col])=>(

// Kaynak: TÜİK Konut Fiyat Endeksi haber bültenleri + TCMB beklentileri
const EKFE_CEYREKLER = [
  // [dönem, yıllık_artış_%]
  ["2025 Q1", 28.5],
  ["2025 Q2", 24.0],

// 2024 Q4 baz → hedef döneme ekstrapolasyon
function ekfeKatsayi(hedefDonem="2026 Q2") {
  const donemler=["2025 Q1","2025 Q2","2025 Q3","2025 Q4","2026 Q1","2026 Q2"];
  const idx=donemler.indexOf(hedefDonem);
  if(idx<0) return 1.0;
  let k=1.0;
  for(let i=0;i<=idx;i++){
    const yillik=EKFE_CEYREKLER[i][1]/100;
    const ceyreklik=Math.pow(1+yillik,0.25)-1;
    k*=(1+ceyreklik);
  }
  return k;
}

// Önbellekle katsayılar
const EKFE_KAT = {

  "2025 Q1": ekfeKatsayi("2025 Q1"),

// Aktif fiyat dönem seçici — baz × EKFE katsayısı
// hedefDonem: "2024 Q4" | "2025 Q1" | ... | "2026 Q2"
// Türkçe karakter normalize
function _normIlce(s){
  return (s||'').toLowerCase().trim()
    .replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s')
    .replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u');
}

// İlçe m² fiyatı — fuzzy Turkish char matching + EKFE katsayısı
function ilceM2Fiyat(ilce, hedefDonem="2026 Q2", override=null) {
  if(override&&override>0) return override;
  // Önce direkt lookup
  let baz = ILCE_M2_FIYAT_BAZ[ilce];
  // Bulamazsa normalize ederek ara
  if(!baz) {
    const n = _normIlce(ilce);
    const key = Object.keys(ILCE_M2_FIYAT_BAZ).find(k =>
      _normIlce(k) === n ||
      _normIlce(k).includes(n) ||
      n.includes(_normIlce(k))
    );
    baz = key ? ILCE_M2_FIYAT_BAZ[key] : ILCE_M2_FIYAT_BAZ["default"];
  }
  const kat = EKFE_KAT[hedefDonem] || ekfeKatsayi(hedefDonem);
  return Math.round(baz * kat);
}

// ── IDW Fiyat Tahmini (Airbnb Madrid repo mantığı) ─────────────────────────
// Yakın ilanların m² fiyatlarından parselin değerini tahmin eder
function idwFiyatTahmin(targetLat, targetLng, ilanlar, power=2) {
  if(!ilanlar||ilanlar.length===0) return null;
  let weightedSum=0, totalWeight=0;
  ilanlar.forEach(ilan=>{
    const dlat=targetLat-ilan.lat;
    const dlng=targetLng-ilan.lng;
    // Yaklaşık mesafe (km)
    const dist=Math.sqrt(dlat*dlat+dlng*dlng)*111;
    const d=Math.max(dist,0.01);
    const w=1/Math.pow(d,power);
    weightedSum+=w*ilan.m2Fiyat;
    totalWeight+=w;
  });
  return Math.round(weightedSum/totalWeight);
}

// Komşuluk Etkisi - Morans I basit proxy (Madrid repo mantigi)
// "Pahalı komşu parseller varsa, bu parsel de değerlenir"
function moransProxy(ilce, il, ilanlar) {
  if(!ilanlar||ilanlar.length<2) return null;
  const prices=ilanlar.map(i=>i.m2Fiyat);
  const mean=prices.reduce((a,b)=>a+b,0)/prices.length;
  const variance=prices.reduce((s,p)=>s+Math.pow(p-mean,2),0)/prices.length;
  const stdDev=Math.sqrt(variance);
  // Komşuluk varyasyon katsayısı — düşük = homojen (güvenilir tahmin)
  const cv=stdDev/mean;
  return {
    mean:Math.round(mean),
    stdDev:Math.round(stdDev),
    cv:+(cv*100).toFixed(1),
    guvenilirlik:cv<0.15?"Yüksek":cv<0.30?"Orta":"Düşük",
    yorum:cv<0.15?"Fiyatlar tutarlı, IDW tahmini güvenilir":
          cv<0.30?"Fiyat dağılımı orta, lokasyon farkı var":
          "Fiyatlar çok değişken, manuel inceleme önerilir",
  };
}

// ── OLS Regresyon Motoru ───────────────────────────────────────────────────
// Kaynak: pro-forma-investment-engine + spatial econometrics (PySAL/geosnap mantığı)

// Yapı türüne göre değişken setleri
const YAPI_DEGISKENLER = {
  konut:  ['m2','oda','kat','binaYasi','metroMesafe','okulSayisi','parkVar','otopark','anaYolCephe','ilceEndeks'],
  ofis:   ['m2','kat','binaYasi','metroMesafe','otoyolMesafe','otopark','anaYolCephe','nufusYogunluk','ilceEndeks'],
  karma:  ['m2','oda','kat','binaYasi','metroMesafe','okulSayisi','otopark','anaYolCephe','nufusYogunluk','ilceEndeks'],
  avm:    ['m2','otoyolMesafe','nufusYogunluk','anaYolCephe','otopark','metroMesafe','ilceEndeks'],
};

// Matris çarpımı
function matMul(A, B) {
  const m=A.length, n=B[0].length, p=B.length;
  return Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>
    A[i].reduce((s,v,k)=>s+v*B[k][j],0)
  ));
}

// Matris transpozu
function matT(A) {
  return A[0].map((_,j)=>A.map(r=>r[j]));
}

// Gaussian elimination ile matris tersi
function matInv(M) {
  const n=M.length;
  const A=M.map(r=>[...r]);
  const I=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let col=0;col<n;col++){
    let maxR=col;
    for(let r=col+1;r<n;r++) if(Math.abs(A[r][col])>Math.abs(A[maxR][col])) maxR=r;
    [A[col],A[maxR]]=[A[maxR],A[col]];
    [I[col],I[maxR]]=[I[maxR],I[col]];
    const piv=A[col][col];
    if(Math.abs(piv)<1e-10) return null;
    for(let j=0;j<n;j++){A[col][j]/=piv;I[col][j]/=piv;}
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=A[r][col];
      for(let j=0;j<n;j++){A[r][j]-=f*A[col][j];I[r][j]-=f*I[col][j];}
    }
  }
  return I;
}

// Normalize — 0-1 arası
function normalizeVars(ilanlar, degiskenler) {
  const mins={}, maxs={};
  degiskenler.forEach(d=>{
    const vals=ilanlar.map(il=>il[d]??0).filter(v=>isFinite(v));
    mins[d]=Math.min(...vals)||0;
    maxs[d]=Math.max(...vals)||1;
  });
  return {mins,maxs};
}

// OLS: β = (XᵀX)⁻¹ Xᵀy
function olsRegresyon(ilanlar, yapiTuru) {
  const degiskenler=YAPI_DEGISKENLER[yapiTuru]||YAPI_DEGISKENLER.konut;

  // En az 5 ilan ve değişkenden fazla ilan gerekli
  const minIlan=degiskenler.length+2;
  if(ilanlar.length<5) return {hata:`En az 5 ilan gerekli (şu an: ${ilanlar.length})`};

  const gecerli=ilanlar.filter(il=>il.m2Fiyat>0&&isFinite(il.m2Fiyat));
  if(gecerli.length<5) return {hata:'Yeterli geçerli ilan yok'};

  // Normalize
  const {mins,maxs}=normalizeVars(gecerli,degiskenler);
  const normVal=(d,v)=>{
    const r=maxs[d]-mins[d];
    return r<1e-6?0:((v??0)-mins[d])/r;
  };

  // X matrisi (intercept + değişkenler)
  const X=gecerli.map(il=>[1,...degiskenler.map(d=>normVal(d,il[d]??0))]);
  const y=gecerli.map(il=>il.m2Fiyat);

  try {
    const Xt=matT(X);
    const XtX=matMul(Xt,X);
    const XtXinv=matInv(XtX);
    if(!XtXinv) return {hata:'Matris tersi alınamadı (bağımlı değişkenler?)'};
    const Xty=matMul(Xt,y.map(v=>[v]));
    const beta=matMul(XtXinv,Xty).map(r=>r[0]);

    // Tahminler
    const yHat=X.map(row=>row.reduce((s,v,i)=>s+v*beta[i],0));
    const yMean=y.reduce((s,v)=>s+v,0)/y.length;

    // R²
    const ssTot=y.reduce((s,v)=>s+Math.pow(v-yMean,2),0);
    const ssRes=y.reduce((s,v,i)=>s+Math.pow(v-yHat[i],2),0);
    const r2=Math.max(0,Math.min(1,1-ssRes/ssTot));

    // RMSE
    const rmse=Math.sqrt(ssRes/y.length);

    // Katsayılar (denormalize — gerçek etki)
    const katsayilar=degiskenler.map((d,i)=>{
      const aralik=maxs[d]-mins[d];
      const gercekEtki=aralik>0?beta[i+1]/aralik:0;
      return {degisken:d, beta:beta[i+1], gercekEtki:Math.round(gercekEtki), normalize:{min:mins[d],max:maxs[d]}};
    });

    return {
      basari:true,
      beta, katsayilar,
      intercept:beta[0],
      r2:+r2.toFixed(3),
      rmse:Math.round(rmse),
      ilanSayisi:gecerli.length,
      degiskenler,
      mins, maxs,
      yapiTuru,
      guvenirlil: r2>=0.75?'Güçlü':r2>=0.55?'Orta':r2>=0.35?'Zayıf':'Yetersiz',
      guvenilirRenk: r2>=0.75?'#16a34a':r2>=0.55?'#2563eb':r2>=0.35?'#d97706':'#ef4444',
    };
  } catch(e) {
    return {hata:'Hesaplama hatası: '+e.message};
  }
}

// Regresyonla tahmin
function olsTahmin(model, ilanOzellikleri) {
  if(!model?.basari) return null;
  const {degiskenler,mins,maxs,beta}=model;
  const normVal=(d,v)=>{
    const r=maxs[d]-mins[d];
    return r<1e-6?0:((v??0)-mins[d])/r;
  };
  const x=[1,...degiskenler.map(d=>normVal(d,ilanOzellikleri[d]??0))];
  const tahmin=x.reduce((s,v,i)=>s+v*beta[i],0);
  const guvenAraligi=model.rmse*1.5;
  return {
    tahmin:Math.max(0,Math.round(tahmin)),
    alt:Math.max(0,Math.round(tahmin-guvenAraligi)),
    ust:Math.round(tahmin+guvenAraligi),
  };
}

// Overpass'tan ulaşım verisi çek
async function fetchUlasim(lat,lng) {
  const r=500; // 500m yarıçap
  const r2=2000; // 2km otoyol için
  const query=`[out:json][timeout:10];
(
  node["railway"~"station|halt|tram_stop"](around:${r},${lat},${lng});
  node["amenity"="bus_station"](around:${r},${lat},${lng});
  node["highway"="bus_stop"](around:500,${lat},${lng});
  node["highway"="motorway_junction"](around:${r2},${lat},${lng});
  node["amenity"="ferry_terminal"](around:${r},${lat},${lng});
  node["amenity"~"school|kindergarten"](around:1000,${lat},${lng});
  node["leisure"="park"](around:500,${lat},${lng});
);out body;`;
  try {
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    const d=await res.json();
    let metro=null,tramvay=null,otobus=null,otoyol=null,vapur=null;
    let okulSayisi=0,parkVar=false;
    d.elements?.forEach(el=>{
      const dist=Math.round(Math.sqrt(Math.pow((el.lat-lat)*111000,2)+Math.pow((el.lon-lng)*111000*Math.cos(lat*Math.PI/180),2)));
      const t=el.tags;
      if(t?.railway==='station'||t?.railway==='halt') metro=metro?Math.min(metro,dist):dist;
      if(t?.railway==='tram_stop') tramvay=tramvay?Math.min(tramvay,dist):dist;
      if(t?.amenity==='bus_station'||t?.highway==='bus_stop') otobus=otobus?Math.min(otobus,dist):dist;
      if(t?.highway==='motorway_junction') otoyol=otoyol?Math.min(otoyol,dist):dist;
      if(t?.amenity==='ferry_terminal') vapur=vapur?Math.min(vapur,dist):dist;
      if(t?.amenity==='school'||t?.amenity==='kindergarten') okulSayisi++;
      if(t?.leisure==='park') parkVar=true;
    });
    // Ana ulaşım mesafesi: en iyi raylı sistem, yoksa otobüs
    const metroMesafe=metro||tramvay||null;
    const otobusMesafe=otobus;
    const otoyolMesafe=otoyol;
    return {metroMesafe,tramvayMesafe:tramvay,otobusMesafe,otoyolMesafe,vapurMesafe:vapur,okulSayisi,parkVar};
  } catch(e) {
    return {metroMesafe:null,otobusMesafe:null,otoyolMesafe:null,okulSayisi:0,parkVar:false};
  }
}

- Ulaşım (%20): metro, otoyol, liman, havalimanı erişimi
- Demografi (%15): nüfus yoğunluğu, büyüme, gelir
- Ticari Potansiyel (%20): ticaret hacmi, sektör uyumu
- Altyapı (%20): elektrik, su, doğalgaz, internet
- Risk (%10): deprem, hukuki, pazar riski
- Gelişme Potansiyeli (%15): imar, bölge gelişim planları

Yatırım alternatifleri: Data Center, Lojistik Merkezi, Teknoloji Kampüsü, Karma Kullanım, AVM, Otel, Konut, Endüstriyel Tesis.

${parcelContext}

Türkçe yanıt ver. Kısa ve net ol. Sayısal analizlerde somut yorum yap.`;

  const sendMessage=async()=>{
    const q=input.trim(); if(!q||loading) return;
    setInput("");
    const newMessages=[...messages,{role:"user",text:q}];
    setMessages(newMessages);
    setLoading(true);

    if(!apiKey){
      setMessages(prev=>[...prev,{role:"assistant",text:"API anahtarı gerekli. Sağ üstteki '🔑 API Key' butonuna tıklayıp Claude API anahtarınızı girin."}]);
      setLoading(false);
      return;
    }

    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1024,
          system:systemPrompt,
          messages:newMessages.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}))
        })
      });
      const data=await resp.json();
      if(data.error){
        setMessages(prev=>[...prev,{role:"assistant",text:`Hata: ${data.error.message}`}]);
      } else {
        setMessages(prev=>[...prev,{role:"assistant",text:data.content?.[0]?.text||"Yanıt alınamadı."}]);
      }
    }catch(e){
      setMessages(prev=>[...prev,{role:"assistant",text:`Bağlantı hatası: ${e.message}. API anahtarını ve internet bağlantısını kontrol edin.`}]);
    }
    setLoading(false);
  };

  const QUICK=[
    "En yüksek skorlu parseli analiz et",
    "Tüm parselleri karşılaştır",
    "Data Center için hangi parsel uygun?",
    "Risk skorları düşük parseller hangileri?",
    "Yatırım öncelik sıramı belirle",
  ];

  return <div style={{display:"flex",flexDirection:"column",height:"100%",gap:0}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontSize:18,fontWeight:700}}>🤖 ISDBM AI Asistanı</div>
        <div style={{fontSize:12,color:"#64748b"}}>Claude Sonnet ile güçlendiriliyor — parsel verilerinizi analiz eder</div>
      </div>
      <button className="btn btn-secondary" style={{fontSize:12}} onClick={()=>setShowKeyInput(v=>!v)}>
        🔑 {apiKey?"API Key ✓":"API Key Gir"}
      </button>
    </div>

    {/* API Key input */}
    {showKeyInput&&<div className="card" style={{marginBottom:14,background:"#fffbeb",border:"1px solid #fbbf24"}}>
      <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:"#92400e"}}>🔑 Claude API Anahtarı</div>
      <div style={{display:"flex",gap:8}}>
        <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
          placeholder="sk-ant-api03-..." style={{flex:1,fontSize:12}}/>
        <button className="btn btn-primary" style={{fontSize:12,whiteSpace:"nowrap"}} onClick={()=>{
          localStorage.setItem("isdbm_claude_key",apiKey);
          setShowKeyInput(false);
        }}>Kaydet</button>
        {apiKey&&<button className="btn btn-danger" style={{fontSize:12}} onClick={()=>{
          setApiKey("");localStorage.removeItem("isdbm_claude_key");
        }}>Sil</button>}
      </div>
      <div style={{fontSize:11,color:"#92400e",marginTop:6}}>
        Anahtar tarayıcıda saklanır. <a href="https://console.anthropic.com/" target="_blank" style={{color:"#2563eb"}}>console.anthropic.com</a> adresinden alabilirsiniz.
      </div>
    </div>}

    {/* Quick actions */}
    {parcels.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
      {QUICK.map((q,i)=><button key={i} className="btn btn-secondary" style={{fontSize:11,padding:"5px 10px"}}
        onClick={()=>{setInput(q);}}>
        {q}
      </button>)}
    </div>}

    {/* Chat messages */}
    <div style={{flex:1,overflowY:"auto",background:"#f8fafc",borderRadius:12,padding:16,minHeight:300,maxHeight:"calc(100vh - 420px)",display:"flex",flexDirection:"column",gap:12}}>
      {messages.map((m,i)=>(
        <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
          <div style={{
            maxWidth:"80%",padding:"10px 14px",borderRadius:m.role==="user"?"12px 12px 2px 12px":"12px 12px 12px 2px",
            background:m.role==="user"?"#2563eb":"#fff",
            color:m.role==="user"?"#fff":"#0f172a",
            fontSize:13,lineHeight:1.6,
            border:m.role==="assistant"?"1px solid #e2e8f0":"none",
            boxShadow:m.role==="assistant"?"0 1px 4px rgba(0,0,0,.06)":"none",
            whiteSpace:"pre-wrap",
          }}>
            {m.role==="assistant"&&<div style={{fontSize:10,color:"#94a3b8",marginBottom:4,fontWeight:600}}>🤖 ISDBM AI</div>}
            {m.text}
          </div>
        </div>
      ))}
      {loading&&<div style={{display:"flex",justifyContent:"flex-start"}}>
        <div style={{padding:"10px 14px",borderRadius:"12px 12px 12px 2px",background:"#fff",border:"1px solid #e2e8f0",fontSize:13,color:"#94a3b8"}}>
          <span style={{animation:"pulse 1s infinite"}}>⏳ Analiz ediliyor…</span>

    {/* Input */}
    <div style={{display:"flex",gap:10,marginTop:12}}>
      <input value={input} onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendMessage()}
        placeholder={parcels.length>0?"Parseller hakkında soru sor…":"Önce haritadan parsel çiz, sonra AI ile analiz et…"}
        style={{flex:1,fontSize:13,padding:"11px 14px"}}/>
      <button className="btn btn-primary" onClick={sendMessage} disabled={loading||!input.trim()} style={{padding:"11px 20px",opacity:loading||!input.trim()?.5:1}}>
        {loading?"⏳":"Gönder ↑"}
      </button>
    </div>
    <div style={{fontSize:10,color:"#94a3b8",textAlign:"center",marginTop:6}}>
      Claude Sonnet 4.6 · Parsel verilerin otomatik context olarak gönderilir · API anahtarın gerekmektedir
    </div>

};

// ── Parcel Form Component (hooks must be at top level) ────────────────────
const ParcelForm=({parcel,onSave,onBack,Shell,toast,setToast})=>{
  const p=parcel;
  const [form,setForm]=useState({...p});
  const [metrics,setMetrics]=useState({...defaultMetrics,...(p.metrics||{})});
  const [pois,setPois]=useState(p.pois||[]);
  const [poiLoading,setPoiLoading]=useState(false);
  const [autoApplied,setAutoApplied]=useState(false);
  const [nufusData,setNufusData]=useState(p.nufusData||null);
  const [nufusLoading,setNufusLoading]=useState(false);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setM=(k,v)=>setMetrics(m=>({...m,[k]:v}));
  const score=useMemo(()=>calcISDBM(metrics),[metrics]);
  const alts=useMemo(()=>calcAlts(metrics,{...p,...form}),[metrics,form]);
  // Nüfus - normalize Turkish chars for matching
  const _normIl=(s='')=>s.trim();
  const nufusIl=TUIK_NUFUS[form.il]||TUIK_NUFUS[p.il]||TUIK_NUFUS[p.geo?.il];
  const nufus=nufusIl?.il||null;
  const _normTR=s=>(s||'').toLowerCase().trim().replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c');
  const _findIlce=(ilData,ilce)=>{
    if(!ilData||!ilce) return null;
    const n=_normTR(ilce);
    const k=Object.keys(ilData.ilceler||{}).find(k=>_normTR(k)===n||_normTR(k).includes(n)||n.includes(_normTR(k)));
    return k?ilData.ilceler[k]:null;
  };
  const nufusIlce=_findIlce(nufusIl, form.ilce||p.ilce);

  // Auto-fetch POI if not already loaded
  useEffect(()=>{
    if(pois.length===0 && p.lat && p.lng){
      setPoiLoading(true);
      fetchPOI(p.lat, p.lng).then(data=>{
        setPois(data);
        setPoiLoading(false);
      }).catch(()=>setPoiLoading(false));
    }
    // Fetch nüfus data
    if(!nufusData && p.lat && p.lng){
      const il=p.il||p.geo?.il||"";
      const ilce=p.ilce||p.geo?.ilce||"";
      if(il){
        setNufusLoading(true);
        fetchNufusData(p.lat, p.lng, il, ilce).then(data=>{
          setNufusData(data);
          setNufusLoading(false);
        }).catch(()=>setNufusLoading(false));
      }
    }
  },[]);

  const handleAutoScore=useCallback(()=>{
    if(poiLoading){ return; } // still loading
    if(pois.length===0){
      // No POI - apply location-based defaults from TUIK
      const lokBonus = LOKASYON_KAT[form.il||p.il||'']||1.0;
      const baseSkor = Math.round(50 + (lokBonus-1)*20);
      setMetrics({
        ulasim:Math.min(90,baseSkor+5),
        demografi:Math.min(85,baseSkor),
        ticari:Math.min(85,baseSkor),
        altyapi:Math.min(80,baseSkor-5),
        risk:Math.min(75,baseSkor-5),
        gelisme:Math.min(85,baseSkor+5),
      });
      setAutoApplied(true);
      return;
    }
    const auto=autoScoreFromPOI(pois, form.alan||p.alan);
    if(auto){ setMetrics(auto); setAutoApplied(true); }
  },[pois, poiLoading, form.alan, form.il, p.alan, p.il]);

  const refreshPOI=()=>{
    if(!p.lat||!p.lng) return;
    setPoiLoading(true);
    fetchPOI(p.lat, p.lng).then(data=>{
      setPois(data);
      setPoiLoading(false);
    }).catch(()=>setPoiLoading(false));
  };

  return <Shell nav="map">
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:16,fontSize:13}}>
      <span style={{cursor:"pointer",color:"#2563eb"}} onClick={onBack}>← Haritaya Dön</span>
      <span style={{color:"#94a3b8"}}> › Yeni Parsel Bilgileri</span>
    </div>
    <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
      <div className="card" style={{flex:"1 1 320px"}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>📋 Parsel Bilgileri</div>
        {p.geo?.display&&<div style={{background:"#eff6ff",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#2563eb"}}>
          📍 {p.geo.display.slice(0,90)}
        </div>}
        <div className="fg"><label>Proje Adı</label>
          <input value={form.projeAdi||""} onChange={e=>setF("projeAdi",e.target.value)} placeholder="Örn: Pendik Lojistik Alanı"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
          <div className="fg"><label>İl</label>
            <select value={form.il||""} onChange={e=>setF("il",e.target.value)}>
              {Object.keys(IL_ILCE).map(il=><option key={il}>{il}</option>)}
              {form.il&&!IL_ILCE[form.il]&&<option value={form.il}>{form.il}</option>}
            </select>
          </div>
          <div className="fg"><label>İlçe</label>
            <input value={form.ilce||""} onChange={e=>setF("ilce",e.target.value)}/>
          </div>
          <div className="fg"><label>Mahalle</label>
            <input value={form.mahalle||""} onChange={e=>setF("mahalle",e.target.value)}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
          <div className="fg"><label>Ada</label><input value={form.ada||""} onChange={e=>setF("ada",e.target.value)}/></div>
          <div className="fg"><label>Parsel</label><input value={form.parsel||""} onChange={e=>setF("parsel",e.target.value)}/></div>
          <div className="fg"><label>Alan (m²)</label>
            <input type="number" value={form.alan||0} onChange={e=>setF("alan",+e.target.value)}/>
            <span style={{fontSize:10,color:"#64748b"}}>Ölçülen: ~{Math.round(p.alan||0).toLocaleString("tr-TR")} m²</span>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:4}}>
          <div className="fg"><label>Plan Durumu</label>
            <select value={form.planDurumu||"Belirsiz"} onChange={e=>setF("planDurumu",e.target.value)}>
              {["Konut Bölgesi","Ticaret Bölgesi","Karma Kullanım","Turizm Bölgesi","Ticaret+Turizm","Ekoturizm Alanı","Lojistik Bölgesi","Sanayi Bölgesi","Tarım Arazisi","Orman Arazisi","Özel Proje Alanı","Belirsiz"].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div className="fg"><label>Mevcut Kullanım</label>
            <select value={form.mevcutKullanim||"Boş Arsa"} onChange={e=>setF("mevcutKullanim",e.target.value)}>
              {["Boş Arsa","Tarım Arazisi","Eski Yapı","Depo/Fabrika","Konut","Ticari Yapı"].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
        </div>

        {/* ── Qbiq Otomatik Hesaplama Paneli — her zaman görünür ── */}
        <div style={{background:"#f0f9ff",border:"1.5px solid #bae6fd",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:"#0369a1"}}>⚡ Qbiq Metodolojisiyle Otomatik Hesapla</div>
              <div style={{fontSize:11,color:"#0284c7",marginTop:2}}>Overpass API POI verisiyle 6 metrik otomatik dolar</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-secondary" style={{fontSize:11,padding:"5px 10px"}} onClick={refreshPOI} disabled={poiLoading}>
                {poiLoading?"⏳ Yükleniyor…":"🔄 POI Yenile"}
              </button>
              <button className="btn btn-primary" style={{fontSize:12,padding:"6px 14px",opacity:poiLoading?0.5:1}}
                onClick={handleAutoScore} disabled={poiLoading}>
                {autoApplied?"✅ Uygulandı":"⚡ Uygula"}
              </button>
            </div>
          </div>

          {/* POI listesi */}
          {poiLoading&&<div style={{fontSize:12,color:"#0284c7",padding:"8px 0"}}>📡 Yakın çevre taranıyor (Overpass API)…</div>}
          {!poiLoading&&pois.length===0&&<div style={{fontSize:12,color:"#94a3b8",padding:"6px 0"}}>
            POI verisi bulunamadı. "🔄 POI Yenile" ile tekrar deneyin.
            {(!p.lat||!p.lng)&&" (Koordinat yok — haritadan parsel çizin)"}
          </div>}
          {pois.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
            {pois.map((poi,i)=><span key={i} className="poi-chip">{poi.icon} {poi.name}</span>)}
          </div>}
          {pois.length>0&&<div style={{fontSize:11,color:"#64748b"}}>
            {pois.length} tesis bulundu (1.5 km) · Kaynak: OpenStreetMap Overpass · Metodoloji: Qbiq proximity band
          </div>}
          {autoApplied&&<div style={{marginTop:8,fontSize:12,color:"#16a34a",fontWeight:500}}>
            ✅ Metrikler POI verisiyle güncellendi. Sliderları manuel ayarlayabilirsiniz.
          </div>}
        </div>

        {/* ── Nüfus Verisi Paneli ── */}
        <div style={{background:"#f0fdf4",border:"1.5px solid #86efac",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <div style={{fontSize:13,fontWeight:700,color:"#166534"}}>👥 Nüfus Verisi</div>
            <div style={{fontSize:10,color:"#16a34a",fontWeight:500}}>
              {nufusLoading?"⏳ Yükleniyor…":nufusData?`Kaynak: ${nufusData.kaynak}`:"Veri bekleniyor"}
            </div>
          </div>
          {nufusLoading&&<div style={{fontSize:12,color:"#16a34a"}}>📡 OSM + TÜİK sorgulanıyor…</div>}
          {!nufusLoading&&!nufusData&&<div style={{fontSize:12,color:"#94a3b8"}}>Veri bulunamadı — il/ilçe bilgisi eksik olabilir.</div>}
          {nufusData&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <div style={{background:"#dcfce7",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#166534",fontWeight:500,marginBottom:2}}>İL NÜFUSU</div>
              <div style={{fontSize:14,fontWeight:800,color:"#15803d"}}>{(nufusData?.il||nufus)?.toLocaleString("tr-TR")||"—"}</div>
              <div style={{fontSize:10,color:"#16a34a"}}>{form.il||p.il}</div>
            </div>
            <div style={{background:"#dcfce7",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#166534",fontWeight:500,marginBottom:2}}>İLÇE NÜFUSU</div>
              <div style={{fontSize:14,fontWeight:800,color:"#15803d"}}>{(nufusData?.ilce||nufusIlce)?.toLocaleString("tr-TR")||"—"}</div>
              <div style={{fontSize:10,color:"#16a34a"}}>{form.ilce||p.ilce||"—"}</div>
            </div>

          </div>}
          {(nufusData?.il||nufus)&&<div style={{marginTop:8,fontSize:11,color:"#166534"}}>
            {(()=>{
              const ilN=nufusData?.il||nufus;
              const ilceN=nufusData?.ilce||nufusIlce;
              if(!ilN) return null;
              return <span>💡 İlçe yoğunluğu: ~%{ilceN&&ilN?Math.round((ilceN/ilN)*100):0} il nüfusunun bu ilçede</span>;
            })()}
          </div>}
        </div>

        <div style={{fontWeight:700,fontSize:14,marginBottom:10,borderTop:"1px solid #f1f5f9",paddingTop:14}}>📊 Metrik Puanları</div>
        {METRICS.map(m=>{
          const v=metrics[m.key]||60;
          const c=v>=80?"#16a34a":v>=60?"#2563eb":"#d97706";
          return <div key={m.key} className="slider-wrap">
            <div className="slider-header">
              <span style={{fontSize:13,fontWeight:500}}>{m.icon} {m.label} <span style={{fontSize:10,color:"#94a3b8"}}>(%{Math.round(m.weight*100)})</span></span>
              <span style={{fontSize:14,fontWeight:700,color:c}}>{v} <span style={{fontSize:11}}>{v>=80?"Çok İyi":v>=60?"İyi":"Orta"}</span></span>
            </div>
            <input type="range" min="0" max="100" value={v} onChange={e=>setM(m.key,+e.target.value)}/>
            <div style={{fontSize:11,color:"#94a3b8"}}>{m.desc}</div>
          </div>;
        })}

        <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={()=>{
          const updated={...p,...form,metrics,score:calcISDBM(metrics)};
          onSave(updated);
        }}>💾 Parseli Kaydet ve Analiz Et →</button>
      </div>

      <div style={{flex:"0 0 220px",display:"flex",flexDirection:"column",gap:14}}>
        <div className="card" style={{textAlign:"center"}}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:8,fontWeight:500}}>CANLI ISDBM SKORU</div>
          <ScoreRing score={score} size={100} color={scoreColor(score)}/>
          <div style={{marginTop:8,fontSize:13,fontWeight:700,color:scoreColor(score)}}>{scoreLabel(score)}</div>
          <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Sliderlara göre güncellenir</div>
        </div>
        <div className="card">
          <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>🏆 En İyi 3 Alternatif</div>
          {alts.slice(0,3).map((alt,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f8fafc",fontSize:12}}>
              <span>{alt.icon} {alt.name}</span>
              <Badge score={alt.score}/>
            </div>
          ))}
        </div>
        <div className="card">
          <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>📐 Parsel Bilgisi</div>
          <InfoRow k="Alan" v={`${Math.round(p.alan||0).toLocaleString("tr-TR")} m²`}/>
          <InfoRow k="Koordinat" v={`${p.lat?.toFixed(4)}, ${p.lng?.toFixed(4)}`}/>
          <InfoRow k="Köşe sayısı" v={`${p.coords?.length||0} nokta`}/>
        </div>
      </div>
    </div>
  </Shell>;
};

const NAV=[
  {key:"dashboard",label:"Dashboard",  icon:"🏠"},
  {key:"map",      label:"Harita & Çiz",icon:"🗺️"},
  {key:"parcels",  label:"Parseller",  icon:"📐"},
  {key:"analyze",  label:"Analiz",     icon:"📊"},
  {key:"reports",  label:"Raporlar",   icon:"📄"},

];

// ── Qbiq-inspired auto-scoring from POI data ───────────────────────────────
// Methodology: proximity bands (walking=0-500m, cycling=500-1500m, driving=1500m+)
// weighted by amenity type importance for each metric
function autoScoreFromPOI(pois, alan){
  if(!pois||pois.length===0) return null;

  const counts={school:0,hospital:0,pharmacy:0,bank:0,supermarket:0,bus_station:0,station:0,halt:0,motorway_junction:0,mall:0};
  pois.forEach(p=>{counts[p.type]=(counts[p.type]||0)+1;});

  // Ulaşım: transit + highway access (Qbiq traffic flow logic)
  const transitScore=Math.min(100, ((counts.station+counts.halt)*25) + (counts.bus_station*12) + (counts.motorway_junction*18));
  const ulasim=Math.max(30, Math.min(95, 40+transitScore));

  // Demografi: population services density (Qbiq amenity proximity)
  const demoScore=Math.min(100, (counts.school*15)+(counts.hospital*20)+(counts.pharmacy*10)+(counts.bank*8));
  const demografi=Math.max(30, Math.min(90, 35+demoScore));

  // Ticari: retail + services density
  const ticariScore=Math.min(100, (counts.supermarket*18)+(counts.mall*25)+(counts.bank*12));
  const ticari=Math.max(30, Math.min(90, 35+ticariScore));

  // Altyapı: infer from POI richness (dense POI = good infra)
  const totalPOI=pois.length;
  const altyapi=Math.max(40, Math.min(90, 40+(totalPOI*4)));

  // Risk: more services = lower risk (established area)
  const risk=Math.max(40, Math.min(85, 40+(totalPOI*3)));

  // Gelişme: hospital + school + mall = growing area
  const gelismeScore=(counts.hospital*15)+(counts.school*10)+(counts.mall*20);
  const gelisme=Math.max(35, Math.min(90, 40+gelismeScore));

  // Alan bonusu: büyük arsa = daha yüksek potansiyel
  const alanBonus=alan>50000?5:alan>20000?3:alan>10000?1:0;

  return {
    ulasim:  Math.min(95, ulasim+alanBonus),
    demografi:Math.min(90, demografi),
    ticari:  Math.min(90, ticari+alanBonus),
    altyapi: Math.min(90, altyapi),
    risk:    Math.min(85, risk),
    gelisme: Math.min(90, gelisme+alanBonus),
  };
}

const BACKEND_URL='https://argeplano-isdbm.onrender.com';

const TerrainLanduse = ({parcel}) => {
  const [terrain, setTerrain]   = React.useState(null);
  const [landuse, setLanduse]   = React.useState(null);
  const [loading, setLoading]   = React.useState(false);
  const [radius, setRadius]     = React.useState(1000);
  const [error, setError]       = React.useState(null);
  const loaded = React.useRef(false);

  // Open-Elevation: 9 noktalı grid, Horn algoritması
  async function fetchTerrain(lat, lng) {
    const d = 0.001; // ~111m grid adımı
    const pts = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++)
        pts.push({latitude: lat + dy*d, longitude: lng + dx*d});
    const r = await fetch('https://api.open-elevation.com/api/v1/lookup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({locations: pts}),
      signal: AbortSignal.timeout(15000),
    });
    const data = await r.json();
    const elev = data.results.map(e => e.elevation);
    // 3x3 grid — Horn algoritması (satır sırası: sol-üst → sağ-alt)
    // [0,1,2 / 3,4,5 / 6,7,8] → [nw,n,ne / w,c,e / sw,s,se]
    const [nw,n,ne,w,c,e,sw,s,se] = elev;
    const cellSize = d * 111320; // metre
    const dzdx = ((ne + 2*e + se) - (nw + 2*w + sw)) / (8 * cellSize);
    const dzdy = ((nw + 2*n + ne) - (sw + 2*s + se)) / (8 * cellSize);
    const slope_rad  = Math.atan(Math.sqrt(dzdx*dzdx + dzdy*dzdy));
    const slope_deg  = +(slope_rad * 180 / Math.PI).toFixed(1);
    const slope_pct  = +(Math.tan(slope_rad) * 100).toFixed(1);
    const aspect_rad = Math.atan2(-dzdy, dzdx);
    const aspect_deg = (aspect_rad * 180 / Math.PI + 360) % 360;
    const baki_dirs  = ['Kuzey','KD','Doğu','GD','Güney','GB','Batı','KB','Kuzey'];
    const baki       = baki_dirs[Math.round(aspect_deg / 45)];
    const uygunluk   = slope_deg < 5 ? 'Çok Uygun' : slope_deg < 15 ? 'Uygun' : slope_deg < 30 ? 'Dikkatli' : 'Riskli';
    const uygunlukRenk = slope_deg<5?'#16a34a':slope_deg<15?'#2563eb':slope_deg<30?'#f59e0b':'#ef4444';
    const risk_skor  = Math.min(100, Math.round(slope_deg * 2.5 + (c < 0 ? 20 : c < 10 ? 10 : 0)));
    return {
      rakım: Math.round(c), eğim_derece: slope_deg, eğim_yüzde: slope_pct,
      bakı: baki, uygunluk, uygunlukRenk, risk_skor,
      grid_min: Math.min(...elev), grid_max: Math.max(...elev),
    };
  }

  // OSM Overpass: arazi kullanım dağılımı
  async function fetchLanduse(lat, lng, r) {
    const mirrors = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
    ];
    const q = `[out:json][timeout:20];(
      way["landuse"](around:${r},${lat},${lng});
      relation["landuse"](around:${r},${lat},${lng});
    );out tags;`;

    let data = null;
    for (const mirror of mirrors) {
      try {
        const res = await fetch(mirror, {
          method:'POST', body:q, signal:AbortSignal.timeout(15000)
        });
        data = await res.json();
        if (data.elements?.length > 0) break;
      } catch(e) { continue; }
    }
    if (!data?.elements?.length) return null;

    const KAT_MAP = {
      residential:'Konut', apartments:'Konut', housing:'Konut',
      commercial:'Ticaret', retail:'Ticaret', office:'Ticaret',
      industrial:'Sanayi', warehouse:'Sanayi', port:'Sanayi',
      farmland:'Tarım', farm:'Tarım', orchard:'Tarım', vineyard:'Tarım',
      forest:'Yeşil', park:'Yeşil', grass:'Yeşil', meadow:'Yeşil', recreation_ground:'Yeşil',
      military:'Askeri', cemetery:'Mezarlık', education:'Eğitim',
      religious:'Dini', hospital:'Sağlık',
    };
    const METRIK_MAP = {
      'Konut':{demografi:0.3,gelisme:0.2},'Ticaret':{ticari:0.35,demografi:0.15},
      'Sanayi':{altyapi:0.3,ulasim:0.2},'Tarım':{risk:0.1},'Yeşil':{demografi:0.1,risk:-0.05},
    };
    const COL = {Konut:'#2563eb',Ticaret:'#16a34a',Sanayi:'#f59e0b',Tarım:'#84cc16',Yeşil:'#22c55e',Askeri:'#ef4444',Diğer:'#94a3b8',Mezarlık:'#6b7280',Eğitim:'#8b5cf6',Dini:'#ec4899',Sağlık:'#06b6d4'};

    const sayım = {};
    data.elements.forEach(el => {
      const lu = el.tags?.landuse || el.tags?.natural || '';
      const kat = KAT_MAP[lu] || 'Diğer';
      sayım[kat] = (sayım[kat]||0) + 1;
    });
    const total = Object.values(sayım).reduce((a,b)=>a+b,0);
    const dagilim = Object.entries(sayım)
      .map(([k,v]) => ({kat:k, sayi:v, yuzde:Math.round(v/total*100), renk:COL[k]||'#94a3b8', metrik:METRIK_MAP[k]||{}}))
      .sort((a,b) => b.sayi-a.sayi);

    // ISDBM metrik katkısı
    const metrik_katki = {};
    dagilim.forEach(d => {
      Object.entries(d.metrik).forEach(([m,w]) => {
        metrik_katki[m] = (metrik_katki[m]||0) + w * (d.yuzde/100);
      });
    });

    return {dagilim, total, metrik_katki, basari:true};
  }

  async function load(r) {
    if (!parcel?.lat || !parcel?.lng) return;
    setLoading(true); setError(null);
    try {
      const [t, l] = await Promise.all([
        fetchTerrain(parcel.lat, parcel.lng),
        fetchLanduse(parcel.lat, parcel.lng, r),
      ]);
      setTerrain(t); setLanduse(l);
    } catch(e) {
      setError('Veri alınamadı: ' + e.message);
    }
    setLoading(false);
    loaded.current = true;
  }

  React.useEffect(() => { load(radius); }, []);

  const METRİK_AD = {ulasim:'Ulaşım',demografi:'Demografi',ticari:'Ticari',altyapi:'Altyapı',risk:'Risk',gelisme:'Gelişme'};

  return (
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:14}}>🏔️ Arazi Analizi</div>
        {loading && <span style={{fontSize:11,color:'#2563eb'}}>⏳ Yükleniyor...</span>}
      </div>

      {error && <div style={{fontSize:11,color:'#ef4444',marginBottom:8}}>{error}</div>}

      {/* Terrain */}
      {terrain && <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:6}}>📐 EĞİM ANALİZİ (Horn Algoritması)</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:8}}>
          {[
            ['Rakım',terrain.rakım+' m','#0ea5e9'],
            ['Eğim',terrain.eğim_derece+'° ('+terrain.eğim_yüzde+'%)','#f59e0b'],
            ['Bakı',terrain.bakı,'#8b5cf6'],
            ['Risk Skoru',terrain.risk_skor+'/100','#ef4444'],
          ].map(([l,v,c])=>(
            <div key={l} style={{background:'#f8fafc',borderRadius:6,padding:'6px 8px'}}>
              <div style={{fontSize:9,color:'#94a3b8'}}>{l}</div>
              <div style={{fontSize:13,fontWeight:700,color:c}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',background:terrain.uygunlukRenk+'22',border:'1px solid '+terrain.uygunlukRenk+'44',borderRadius:6}}>
          <span style={{fontSize:16}}>{terrain.uygunluk==='Çok Uygun'?'✅':terrain.uygunluk==='Uygun'?'🟢':terrain.uygunluk==='Dikkatli'?'⚠️':'🔴'}</span>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:terrain.uygunlukRenk}}>{terrain.uygunluk}</div>
            <div style={{fontSize:10,color:'#64748b'}}>Eğim: {terrain.eğim_derece}° · Min/Max: {terrain.grid_min}/{terrain.grid_max}m</div>
          </div>
        </div>
      </div>}

      {/* Landuse */}
      {landuse && <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div style={{fontSize:11,fontWeight:600,color:'#64748b'}}>🗺️ ARAZİ KULLANIMI</div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <select value={radius} onChange={e=>{setRadius(parseInt(e.target.value));}}
              style={{fontSize:10,padding:'2px 4px',borderRadius:4,border:'1px solid #e2e8f0'}}>
              {[500,750,1000,1500,2000,3000].map(v=><option key={v} value={v}>{v}m</option>)}
            </select>
            <button onClick={()=>load(radius)}
              style={{fontSize:10,padding:'2px 8px',borderRadius:4,background:'#2563eb',color:'#fff',border:'none',cursor:'pointer'}}>
              🔄
            </button>
          </div>
        </div>
        <div style={{fontSize:10,color:'#94a3b8',marginBottom:6}}>{landuse.total} alan · {radius}m yarıçap</div>
        {landuse.dagilim.slice(0,6).map(d=>(
          <div key={d.kat} style={{marginBottom:5}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
              <span style={{fontSize:10,fontWeight:500}}>{d.kat}</span>
              <span style={{fontSize:10,color:'#64748b'}}>{d.yuzde}%</span>
            </div>
            <div style={{height:6,background:'#f1f5f9',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:d.yuzde+'%',background:d.renk,borderRadius:3}}/>
            </div>
          </div>
        ))}
        {Object.keys(landuse.metrik_katki).length>0 && (
          <div style={{marginTop:8,padding:'6px 8px',background:'#f0f9ff',borderRadius:6,border:'1px solid #bae6fd'}}>
            <div style={{fontSize:10,fontWeight:600,color:'#0369a1',marginBottom:4}}>📊 ISDBM Metrik Katkısı</div>
            {Object.entries(landuse.metrik_katki).map(([m,w])=>(
              <div key={m} style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:2}}>
                <span style={{color:'#475569'}}>{METRİK_AD[m]||m}</span>
                <span style={{color:w>0?'#16a34a':'#ef4444',fontWeight:600}}>{w>0?'+':''}{(w*100).toFixed(0)}%</span>
              </div>
            ))}
          </div>
        )}
      </div>}

      {!terrain && !landuse && !loading && (
        <div style={{fontSize:11,color:'#94a3b8',textAlign:'center',padding:'10px 0'}}>
          <button onClick={()=>load(radius)} style={{fontSize:11,padding:'6px 14px',borderRadius:6,background:'#2563eb',color:'#fff',border:'none',cursor:'pointer'}}>
            🔄 Arazi Analizi Yükle
          </button>
        </div>
      )}
    </div>
  );
};

// Kütüphaneler: web-ifc (IFC), Three.js GLTFLoader (GLB/glTF)

function loadScript(src){
  return new Promise(function(res,rej){
    if(document.querySelector('script[src="'+src+'"]'))return res();
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

var BIMViewer=({parcel,onClose})=>{
  const mountRef=useRef(null);
  const rendRef=useRef(null);
  const sceneRef=useRef(null);
  const camRef=useRef(null);
  const rafRef=useRef(null);
  const modelRef=useRef(null);
  const [status,setStatus]=useState('');
  const [modelInfo,setModelInfo]=useState(null);
  const [rotating,setRotating]=useState(false);
  const [loaded,setLoaded]=useState(false);
  const rotRef=useRef(false);
  useEffect(()=>{rotRef.current=rotating;},[rotating]);

  // Three.js sahneyi kur
  useEffect(()=>{
    let renderer,camera,scene,animId;
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js')
      .then(()=>{
        const THREE=window.THREE;
        const W=mountRef.current.clientWidth,H=mountRef.current.clientHeight;
        scene=new THREE.Scene();scene.background=new THREE.Color(0x1a2a3a);
        sceneRef.current=scene;
        camera=new THREE.PerspectiveCamera(50,W/H,0.01,10000);
        camera.position.set(0,10,20);camRef.current=camera;
        renderer=new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(W,H);renderer.shadowMap.enabled=true;
        renderer.outputEncoding=THREE.sRGBEncoding;
        rendRef.current=renderer;
        mountRef.current.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff,0.8));
        var sun=new THREE.DirectionalLight(0xfff5e0,1.2);sun.position.set(10,20,10);sun.castShadow=true;scene.add(sun);
        var fill=new THREE.DirectionalLight(0x4488ff,0.4);fill.position.set(-10,5,-10);scene.add(fill);
        var grid=new THREE.GridHelper(100,20,0x334455,0x223344);scene.add(grid);
        // Mouse kontrol
        var drag=false,px=0,py=0,theta=0,phi=30,r=20;
        var el=renderer.domElement;
        el.addEventListener('mousedown',function(e){drag=true;px=e.clientX;py=e.clientY;});
        el.addEventListener('mouseup',function(){drag=false;});
        el.addEventListener('mousemove',function(e){
          if(!drag)return;
          theta-=(e.clientX-px)*0.4;phi=Math.max(5,Math.min(85,phi-(e.clientY-py)*0.4));
          px=e.clientX;py=e.clientY;
        });
        el.addEventListener('wheel',function(e){r=Math.max(1,Math.min(500,r+e.deltaY*0.05));e.preventDefault();},{passive:false});
        var lt=null;
        el.addEventListener('touchstart',function(e){lt=e.touches[0];},{passive:true});
        el.addEventListener('touchmove',function(e){
          if(!lt)return;
          theta-=(e.touches[0].clientX-lt.clientX)*0.5;
          phi=Math.max(5,Math.min(85,phi-(e.touches[0].clientY-lt.clientY)*0.5));
          lt=e.touches[0];e.preventDefault();
        },{passive:false});
        function animate(){
          animId=requestAnimationFrame(animate);
          if(rotRef.current&&!drag)theta+=0.15;
          var t=theta*Math.PI/180,p=phi*Math.PI/180;
          camera.position.set(r*Math.sin(t)*Math.cos(p),r*Math.sin(p),r*Math.cos(t)*Math.cos(p));
          camera.lookAt(0,0,0);renderer.render(scene,camera);
        }
        rafRef.current=animId;animate();
        setLoaded(true);
      });
    return ()=>{
      cancelAnimationFrame(rafRef.current);
      if(rendRef.current&&mountRef.current){
        try{mountRef.current.removeChild(rendRef.current.domElement);}catch(e){}
        rendRef.current.dispose();
      }
    };
  },[]);

  // GLB/glTF yükle
  async function loadGLB(file){
    setStatus('GLB/glTF yükleniyor...');
    try{
      await loadScript('https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js');
      const THREE=window.THREE;
      const url=URL.createObjectURL(file);
      const loader=new THREE.GLTFLoader();
      loader.load(url,function(gltf){
        if(modelRef.current)sceneRef.current.remove(modelRef.current);
        const model=gltf.scene;
        // Bounding box — modeli merkeze ve zemine oturt
        const box=new THREE.Box3().setFromObject(model);
        const center=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());
        model.position.sub(center);
        model.position.y+=size.y/2;
        // Ölçek — max 20 birim
        const maxDim=Math.max(size.x,size.y,size.z);
        if(maxDim>20)model.scale.multiplyScalar(20/maxDim);
        sceneRef.current.add(model);
        modelRef.current=model;
        // Kamera mesafesini ayarla
        const scaledMax=Math.max(size.x,size.y,size.z)*(20/Math.max(size.x,size.y,size.z));
        setModelInfo({
          tip:'GLB/glTF',dosya:file.name,
          boyut:(file.size/1024).toFixed(0)+' KB',
          boyutlar:size.x.toFixed(1)+'x'+size.y.toFixed(1)+'x'+size.z.toFixed(1)+' m'
        });
        setStatus('');
        URL.revokeObjectURL(url);
      },function(p){

      await loadScript('https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/web-ifc-api.js');

      const url=URL.createObjectURL(file);
      const ifcLoader=new window.IFCLoader();
      await ifcLoader.ifcManager.setWasmPath('https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/');
      ifcLoader.load(url,function(model){
        if(modelRef.current)sceneRef.current.remove(modelRef.current);
        const box=new THREE.Box3().setFromObject(model);
        const center=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());
        model.position.sub(center);model.position.y+=size.y/2;

        URL.revokeObjectURL(url);

        setStatus('IFC hata: '+e.message);

  model: null,      // Three.js Object3D
  ready: false,
