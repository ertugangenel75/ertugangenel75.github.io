<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ── Constants ──────────────────────────────────────────────────────────────
const IL_ILCE={
  "İstanbul":["Pendik","Kadıköy","Beşiktaş","Üsküdar","Maltepe","Ataşehir","Kartal","Tuzla","Silivri","Çekmeköy","Beykoz","Sarıyer","Şile","Adalar","Arnavutköy","Avcılar","Bağcılar","Bahçelievler","Bakırköy","Başakşehir","Bayrampaşa","Beylikdüzü","Beyoğlu","Büyükçekmece","Çatalca","Esenler","Esenyurt","Eyüpsultan","Fatih","Gaziosmanpaşa","Güngören","Kâğıthane","Küçükçekmece","Sultangazi","Şişli","Zeytinburnu"],
  "Ankara":["Çankaya","Keçiören","Yenimahalle","Sincan","Mamak","Etimesgut","Pursaklar","Gölbaşı","Altındağ","Polatlı","Beypazarı","Nallıhan","Haymana"],
  "İzmir":["Bornova","Karşıyaka","Konak","Buca","Bayraklı","Gaziemir","Menemen","Torbalı","Balçova","Çiğli","Karabağlar","Kemalpaşa","Seferihisar"],
  "Bursa":["Nilüfer","Osmangazi","Yıldırım","Mudanya","Gemlik","İnegöl","Gürsu","Kestel","Orhangazi","Karacabey"],
  "Antalya":["Muratpaşa","Konyaaltı","Kepez","Aksu","Döşemealtı","Alanya","Manavgat","Serik","Kemer","Finike"],
  "Kocaeli":["İzmit","Gebze","Darıca","Körfez","Çayırova","Dilovası","Kartepe","Başiskele","Derince","Gölcük"],
  "Gaziantep":["Şahinbey","Şehitkamil","Nizip","İslahiye","Nurdağı","Oğuzeli","Araban"],
  "Konya":["Selçuklu","Karatay","Meram","Ereğli","Akşehir","Beyşehir","Seydişehir","Ilgın"],
  "Mersin":["Yenişehir","Akdeniz","Mezitli","Toroslar","Tarsus","Silifke","Erdemli","Anamur"],
  "Adana":["Seyhan","Yüreğir","Çukurova","Sarıçam","Kozan","Ceyhan","İmamoğlu"],
};

const METRICS=[
  {key:"ulasim",   label:"Ulaşım",            weight:.20,desc:"Metro, otoyol, liman, havalimanı erişimi",    icon:"🚇"},
  {key:"demografi",label:"Demografi",          weight:.15,desc:"Nüfus yoğunluğu, büyüme, gelir seviyesi",    icon:"👥"},
  {key:"ticari",   label:"Ticari Potansiyel",  weight:.20,desc:"Ticaret hacmi, sektör uyumu, talep",         icon:"📈"},
  {key:"altyapi",  label:"Altyapı",            weight:.20,desc:"Elektrik, su, doğalgaz, internet altyapısı", icon:"⚡"},
  {key:"risk",     label:"Risk",               weight:.10,desc:"Deprem riski, hukuki durum, pazar riski",    icon:"🛡️"},
  {key:"gelisme",  label:"Gelişme Potansiyeli",weight:.15,desc:"İmar durumu, bölge gelişim planları",        icon:"🚀"},
];

const INV_TEMPLATES=[
  {name:"Data Center Campus",       icon:"🏗️",scoreBonus:{altyapi:.3,ulasim:.2},capex:"450-600 M$",roi:"12-18%",irr:"14-22%",sure:"24-36 ay",kapasite:"40-60 MW"},
  {name:"Lojistik Merkezi",         icon:"🚚",scoreBonus:{ulasim:.3,altyapi:.2},capex:"80-150 M$",roi:"14-20%",irr:"16-24%",sure:"18-24 ay",kapasite:"50.000 m²"},
  {name:"Teknoloji Kampüsü",        icon:"💻",scoreBonus:{demografi:.25,ticari:.25},capex:"200-350 M$",roi:"10-15%",irr:"12-18%",sure:"30-42 ay",kapasite:"30.000 m²"},
  {name:"Karma Kullanım",           icon:"🏢",scoreBonus:{demografi:.2,ticari:.2},capex:"150-280 M$",roi:"8-14%",irr:"10-16%",sure:"36-48 ay",kapasite:"25.000 m²"},
  {name:"AVM / Ticaret Merkezi",    icon:"🛒",scoreBonus:{ticari:.3,demografi:.2},capex:"100-200 M$",roi:"9-13%",irr:"11-15%",sure:"24-36 ay",kapasite:"20.000 m²"},
  {name:"Otel / Turizm",            icon:"🏨",scoreBonus:{ulasim:.25,demografi:.15},capex:"50-120 M$",roi:"7-12%",irr:"9-14%",sure:"18-30 ay",kapasite:"150-300 oda"},
  {name:"Konut Projesi",            icon:"🏘️",scoreBonus:{demografi:.3,gelisme:.2},capex:"40-100 M$",roi:"15-25%",irr:"18-28%",sure:"24-36 ay",kapasite:"200-500 konut"},
  {name:"Endüstriyel Tesis",        icon:"🏭",scoreBonus:{altyapi:.25,ulasim:.25},capex:"30-80 M$",roi:"11-17%",irr:"13-19%",sure:"12-18 ay",kapasite:"Özelleştirilmiş"},
];

// TÜİK nüfus verileri (2023)
const TUIK_NUFUS={
  "İstanbul":15655924,"Ankara":5782285,"İzmir":4479525,"Bursa":3194720,
  "Antalya":2688004,"Kocaeli":2053743,"Konya":2321969,"Gaziantep":2220125,
  "Mersin":1922871,"Adana":2274106,
};

const STORAGE_KEY="isdbm_parcels_v2";

function saveToLocal(parcels){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(parcels));}catch(e){}
}
function loadFromLocal(){
  try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):[];}catch(e){return [];}
}

function calcISDBM(m){
  return Math.round(METRICS.reduce((s,mt)=>s+(m[mt.key]||50)*mt.weight,0));
}
function calcAlts(m){
  const base=calcISDBM(m);
  return INV_TEMPLATES.map(t=>{
    let bonus=0;
    Object.entries(t.scoreBonus).forEach(([k,w])=>{bonus+=((m[k]||50)-50)*w;});
    const score=Math.min(100,Math.max(0,Math.round(base+bonus)));
    const uyg=score>=85?"Çok Yüksek":score>=75?"Yüksek":score>=60?"Orta":"Düşük";
    const uygColor=score>=85?"#16a34a":score>=75?"#2563eb":score>=60?"#d97706":"#ef4444";
    return{...t,score,uyg,uygColor};
  }).sort((a,b)=>b.score-a.score);
}
function scoreColor(s){return s>=85?"#16a34a":s>=75?"#2563eb":s>=60?"#d97706":"#ef4444";}
function scoreLabel(s){return s>=85?"Mükemmel Fırsat":s>=75?"Güçlü Fırsat":s>=60?"Orta Potansiyel":"Düşük Potansiyel";}

// Polygon area in m²
function polyArea(coords){
  if(!coords||coords.length<3)return 0;
  let a=0;
  for(let i=0,j=coords.length-1;i<coords.length;j=i++){
    const xi=coords[i][1]*Math.PI/180*6371000;
    const yi=coords[i][0]*Math.PI/180*6371000;
    const xj=coords[j][1]*Math.PI/180*6371000;
    const yj=coords[j][0]*Math.PI/180*6371000;
    a+=(xj+xi)*(yj-yi);
  }
  return Math.abs(a/2);
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function Toast({msg,onClose}){
  useEffect(()=>{toastTimer=setTimeout(onClose,3000);return()=>clearTimeout(toastTimer);},[]);
  if(!msg)return null;
  return <div className="toast">✅ {msg}<span style={{marginLeft:8,cursor:'pointer',opacity:.6}} onClick={onClose}>✕</span></div>;
}

// ── ScoreRing ──────────────────────────────────────────────────────────────
const ScoreRing=({score,size=72,color="#2563eb"})=>{
  const r=size/2-7,circ=2*Math.PI*r,offset=circ-(score/100)*circ;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth="5"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5"
      strokeDasharray={circ.toFixed(1)} strokeDashoffset={offset.toFixed(1)}
      strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}/>
    <text x={size/2} y={size/2+5} textAnchor="middle" fill={color} fontSize={size>80?18:13} fontWeight="700">{score}</text>
  </svg>;
};
const Badge=({score})=>{
  const c=scoreColor(score),bg=score>=85?"#dcfce7":score>=75?"#dbeafe":score>=60?"#fef3c7":"#fee2e2";
  return <span className="badge" style={{background:bg,color:c}}>{score}</span>;
};
const InfoRow=({k,v})=><div className="info-row"><span className="k">{k}</span><span className="v">{v}</span></div>;

// ── Overpass POI fetch ─────────────────────────────────────────────────────
async function fetchPOI(lat,lng,radius=1500){
  const query=`[out:json][timeout:15];
(
  node["amenity"~"school|hospital|pharmacy|bank|supermarket|bus_station"](around:${radius},${lat},${lng});
  node["shop"~"supermarket|mall"](around:${radius},${lat},${lng});
  node["railway"~"station|halt"](around:${radius},${lat},${lng});
  node["highway"="motorway_junction"](around:${radius},${lat},${lng});
);
out body;`;
  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
    const d=await r.json();
    const icons={"school":"🏫","hospital":"🏥","pharmacy":"💊","bank":"🏦","supermarket":"🛒","bus_station":"🚌","station":"🚉","halt":"🚉","motorway_junction":"🛣️","mall":"🏬"};
    return d.elements.slice(0,12).map(e=>({
      name:e.tags?.name||e.tags?.amenity||e.tags?.shop||e.tags?.railway||"Tesis",
      type:e.tags?.amenity||e.tags?.shop||e.tags?.railway||"other",
      icon:icons[e.tags?.amenity||e.tags?.shop||e.tags?.railway]||"📍",
      lat:e.lat,lng:e.lon,
    }));
  }catch{return[];}
}

// ── Nominatim reverse geocode ─────────────────────────────────────────────
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=tr&zoom=16`);
    const d=await r.json();
    const a=d.address||{};
    return{
      il:a.province||a.state||"",
      ilce:a.county||a.city_district||a.suburb||"",
      mahalle:a.neighbourhood||a.quarter||a.suburb||"",
      postakodu:a.postcode||"",
      display:d.display_name||"",
    };
  }catch{return{};}
}

// ── Map Component ──────────────────────────────────────────────────────────
const MapFull=({parcels,onParcelSaved,onDrawnCoords,drawMode,setDrawMode,flyTo})=>{
  const mapRef=useRef(null),leafRef=useRef(null),layersRef=useRef({});
  const drawnPtsRef=useRef([]),drawnMarkersRef=useRef([]),drawnPolyRef=useRef(null);
  const parcelLayersRef=useRef([]),circleRef=useRef(null);
  const [searchQ,setSearchQ]=useState(""),[results,setResults]=useState([]);
  const [activeLayer,setActiveLayer]=useState("osm");
  const [coords,setCoords]=useState("—"),[zoom,setZoom]=useState(6);
  const [drawPts,setDrawPts]=useState(0);
  const [loadingPOI,setLoadingPOI]=useState(false);

  useEffect(()=>{
    if(leafRef.current)return;
    const map=L.map(mapRef.current,{zoomControl:true}).setView([39.0,35.0],6);
    leafRef.current=map;
    const layers={
      osm:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}),
      satellite:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"© Esri",maxZoom:19}),
      topo:L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{attribution:"© OpenTopoMap",maxZoom:17}),
    };
    layersRef.current=layers;
    layers.osm.addTo(map);
    map.on("mousemove",e=>setCoords(`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`));
    map.on("zoom",()=>setZoom(map.getZoom()));
    return()=>{map.remove();leafRef.current=null;};
  },[]);

  // Draw click handler
  useEffect(()=>{
    const map=leafRef.current; if(!map)return;
    const handler=async(e)=>{
      if(!drawMode)return;
      const pt=[e.latlng.lat,e.latlng.lng];
      drawnPtsRef.current=[...drawnPtsRef.current,pt];
      // Marker
      const m=L.circleMarker(e.latlng,{radius:6,color:"#ef4444",fillColor:"#fff",fillOpacity:1,weight:2}).addTo(map);
      drawnMarkersRef.current.push(m);
      // Update polyline preview
      if(drawnPolyRef.current)map.removeLayer(drawnPolyRef.current);
      if(drawnPtsRef.current.length>1){
        drawnPolyRef.current=L.polygon(drawnPtsRef.current,{color:"#ef4444",fillColor:"#ef4444",fillOpacity:.15,weight:2,dashArray:"6,3"}).addTo(map);
      }
      setDrawPts(drawnPtsRef.current.length);
    };
    map.on("click",handler);
    return()=>map.off("click",handler);
  },[drawMode]);

  // Finish draw
  const finishDraw=useCallback(async()=>{
    const pts=drawnPtsRef.current;
    if(pts.length<3){alert("En az 3 nokta işaretleyin.");return;}
    const map=leafRef.current;
    // Clean preview
    drawnMarkersRef.current.forEach(m=>map.removeLayer(m));
    drawnMarkersRef.current=[];
    if(drawnPolyRef.current){map.removeLayer(drawnPolyRef.current);drawnPolyRef.current=null;}

    // Final polygon
    const poly=L.polygon(pts,{color:"#ef4444",fillColor:"#ef4444",fillOpacity:.2,weight:2.5}).addTo(map);
    const center=poly.getBounds().getCenter();
    const area=Math.round(polyArea(pts));

    // Reverse geocode
    const geo=await reverseGeocode(center.lat,center.lng);

    // 1km circle
    if(circleRef.current)map.removeLayer(circleRef.current);
    circleRef.current=L.circle([center.lat,center.lng],{radius:1000,color:"#2563eb",fillColor:"#2563eb",fillOpacity:.04,weight:1.5,dashArray:"6,4"}).addTo(map);

    // POI fetch
    setLoadingPOI(true);
    const pois=await fetchPOI(center.lat,center.lng);
    setLoadingPOI(false);

    const parcelData={
      id:Date.now(),
      lat:center.lat,lng:center.lng,
      coords:pts,
      alan:area,
      geo,
      pois,
      il:geo.il||"",
      ilce:geo.ilce||"",
      mahalle:geo.mahalle||"",
      ada:"",parsel:"",
      projeAdi:"",
      planDurumu:"Belirsiz",
      mevcutKullanim:"Boş Arsa",
      metrics:{ulasim:60,demografi:60,ticari:60,altyapi:60,risk:60,gelisme:60},
      score:0,
      tarih:new Date().toLocaleDateString("tr-TR"),
      status:"Taslak",
    };

    map.fitBounds(poly.getBounds(),{padding:[40,40]});

    // Reset draw state
    drawnPtsRef.current=[];
    setDrawPts(0);
    setDrawMode(false);

    onParcelSaved(parcelData,poly);
  },[onParcelSaved,setDrawMode]);

  const cancelDraw=useCallback(()=>{
    const map=leafRef.current; if(!map)return;
    drawnMarkersRef.current.forEach(m=>map.removeLayer(m));
    drawnMarkersRef.current=[];
    if(drawnPolyRef.current){map.removeLayer(drawnPolyRef.current);drawnPolyRef.current=null;}
    drawnPtsRef.current=[];
    setDrawPts(0);
    setDrawMode(false);
  },[setDrawMode]);

  // Show saved parcels on map
  useEffect(()=>{
    const map=leafRef.current; if(!map)return;
    parcelLayersRef.current.forEach(l=>map.removeLayer(l));
    parcelLayersRef.current=[];
    parcels.forEach(p=>{
      if(!p.coords||p.coords.length<3)return;
      const c=scoreColor(p.score||0);
      const poly=L.polygon(p.coords,{color:c,fillColor:c,fillOpacity:.18,weight:2}).addTo(map);
      const ic=L.divIcon({className:"",html:`<div style="background:${c};color:#fff;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap">${p.projeAdi||p.ada||"Arsa"} — ${p.score||"?"}</div>`,iconAnchor:[40,10]});
      const mk=L.marker([p.lat,p.lng],{icon:ic}).addTo(map);
      mk.bindPopup(`<b>${p.projeAdi||"İsimsiz Arsa"}</b><br>${p.il} / ${p.ilce}<br>Alan: ${(p.alan||0).toLocaleString("tr-TR")} m²<br>ISDBM: <b>${p.score||"—"}</b>`);
      parcelLayersRef.current.push(poly,mk);
    });
  },[parcels]);

  // Fly to
  useEffect(()=>{
    if(!flyTo||!leafRef.current)return;
    leafRef.current.setView([flyTo.lat,flyTo.lng],16);
  },[flyTo]);

  const switchLayer=name=>{
    const map=leafRef.current; if(!map)return;
    Object.values(layersRef.current).forEach(l=>{try{map.removeLayer(l);}catch(e){}});
    layersRef.current[name].addTo(map);
    setActiveLayer(name);
  };

  const doSearch=q=>{
    if(q.length<3){setResults([]);return;}
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+", Türkiye")}&limit=6&countrycodes=tr&accept-language=tr`)
      .then(r=>r.json()).then(setResults).catch(()=>{});
  };
  const gotoResult=item=>{
    const map=leafRef.current; if(!map)return;
    map.setView([+item.lat,+item.lon],16);
    setResults([]);setSearchQ(item.display_name.split(",")[0]);
  };

  return <div style={{flex:1,display:"flex",flexDirection:"column"}}>
    <div style={{flex:1,position:"relative",minHeight:400}}>
      {/* Search */}
      <div className="map-search">
        <span style={{color:"#94a3b8",fontSize:16}}>🔍</span>
        <input value={searchQ} onChange={e=>{setSearchQ(e.target.value);doSearch(e.target.value);}} placeholder="Adres, mahalle, ilçe ara..."/>
        {searchQ&&<span style={{cursor:"pointer",color:"#94a3b8",fontSize:12}} onClick={()=>{setSearchQ("");setResults([]);}}>✕</span>}
      </div>
      {results.length>0&&<div className="nom-results">
        {results.map((r,i)=><div key={i} className="nom-item" onClick={()=>gotoResult(r)}>📍 {r.display_name.length>60?r.display_name.slice(0,60)+"…":r.display_name}</div>)}
      </div>}

      {/* Layer buttons */}
      <div style={{position:"absolute",top:10,right:10,z:999,display:"flex",flexDirection:"column",gap:6,zIndex:999}}>
        {[["osm","🗺️ OSM"],["satellite","🛰️ Uydu"],["topo","📊 Topo"]].map(([k,l])=>(
          <button key={k} className={`map-fab${activeLayer===k?" active":""}`} onClick={()=>switchLayer(k)} style={{top:"auto",right:"auto",position:"relative"}}>{l}</button>
        ))}
      </div>

      {/* Draw controls */}
      <div style={{position:"absolute",bottom:50,right:10,zIndex:999,display:"flex",flexDirection:"column",gap:6}}>
        {!drawMode&&<button className="map-fab" onClick={()=>setDrawMode(true)} style={{position:"relative",background:"#2563eb",color:"#fff",border:"none"}}>✏️ Parsel Çiz</button>}
        {drawMode&&<>
          <button className="map-fab" style={{position:"relative",background:"#16a34a",color:"#fff",border:"none"}} onClick={finishDraw} disabled={drawPts<3}>
            ✅ Tamamla ({drawPts} nokta)
          </button>
          <button className="map-fab" style={{position:"relative",background:"#ef4444",color:"#fff",border:"none"}} onClick={cancelDraw}>✕ İptal</button>
        </>}
      </div>

      {/* Draw hint */}
      {drawMode&&<div className="draw-hint">
        {drawPts<3?`Haritada ${drawPts} nokta işaretlendi — en az 3 gerekli`:`${drawPts} nokta — "Tamamla" ile parseli kaydedin`}
      </div>}

      {loadingPOI&&<div className="draw-hint">Yakın çevre analizi yapılıyor…</div>}

      <div ref={mapRef} id="leaflet-map" style={{cursor:drawMode?"crosshair":"grab"}}/>
    </div>
    <div className="statusbar">
      <span>Koordinat: <span style={{color:"#60a5fa"}}>{coords}</span></span>
      <span>Zoom: <span style={{color:"#60a5fa"}}>{zoom}</span></span>
      <span style={{marginLeft:"auto"}}>© OpenStreetMap | ISDBM Digital</span>
    </div>
  </div>;
};

// ── PDF Generator ──────────────────────────────────────────────────────────
function generatePDF(parcel,alts,isdbmScore){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,mg=18;let y=mg;
  const txt=(t,x,sz=10,bold=false,col=[30,30,30])=>{doc.setFontSize(sz);doc.setFont("helvetica",bold?"bold":"normal");doc.setTextColor(...col);doc.text(t,x,y);y+=sz*.4+3;};
  const hl=(col=[226,232,240])=>{doc.setDrawColor(...col);doc.line(mg,y,W-mg,y);y+=4;};

  doc.setFillColor(15,23,42);doc.rect(0,0,W,28,"F");
  doc.setFontSize(18);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);doc.text("ISDBM Digital",mg,12);
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(148,163,184);doc.text("ARGEPLANO | Investment Intelligence Platform",mg,19);
  doc.setFontSize(10);doc.setTextColor(96,165,250);doc.text("YATIRIM ANALİZ RAPORU",W-mg,12,{align:"right"});
  doc.setFontSize(8);doc.setTextColor(148,163,184);doc.text(new Date().toLocaleDateString("tr-TR"),W-mg,19,{align:"right"});
  y=36;

  const sc=isdbmScore;
  const[r2,g2,b2]=sc>=85?[22,163,74]:sc>=75?[37,99,235]:sc>=60?[217,119,6]:[239,68,68];
  doc.setFontSize(16);doc.setFont("helvetica","bold");doc.setTextColor(15,23,42);
  doc.text(`${parcel.projeAdi||parcel.ada||"İsimsiz"} — ${parcel.il} / ${parcel.ilce}`,mg,y);y+=10;

  doc.setFillColor(r2,g2,b2);doc.roundedRect(mg,y,50,22,3,3,"F");
  doc.setFontSize(22);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);doc.text(String(sc),mg+25,y+12,{align:"center"});
  doc.setFontSize(7);doc.text("ISDBM SKORU",mg+25,y+18,{align:"center"});
  doc.setFontSize(10);doc.setFont("helvetica","bold");doc.setTextColor(r2,g2,b2);doc.text(scoreLabel(sc),mg+56,y+8);
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(100,116,139);doc.text("Ağırlıklı bütünleşik yatırım potansiyel skoru",mg+56,y+15);
  y+=30;hl();

  txt("PARSEL BİLGİLERİ",mg,11,true,[15,23,42]);
  [[`${parcel.il} / ${parcel.ilce}`,`Mahalle: ${parcel.mahalle||"—"}`],[`Ada: ${parcel.ada||"—"} / Parsel: ${parcel.parsel||"—"}`,`Alan: ${Number(parcel.alan||0).toLocaleString("tr-TR")} m²`],[`Plan Durumu: ${parcel.planDurumu||"—"}`,`Mevcut Kullanım: ${parcel.mevcutKullanim||"—"}`]].forEach(([a,b])=>{
    doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(15,23,42);doc.text(a,mg,y);doc.text(b,W/2,y);y+=7;
  });y+=2;hl();

  txt("ANALİZ METRİKLERİ",mg,11,true,[15,23,42]);
  METRICS.forEach(m=>{
    const sv=parcel.metrics?.[m.key]||50;
    const[r,g,b]=sv>=85?[22,163,74]:sv>=75?[37,99,235]:sv>=60?[217,119,6]:[239,68,68];
    doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(15,23,42);doc.text(m.label,mg,y);
    doc.setFillColor(226,232,240);doc.rect(mg+52,y-4,80,5,"F");
    doc.setFillColor(r,g,b);doc.rect(mg+52,y-4,80*(sv/100),5,"F");
    doc.setFontSize(9);doc.setFont("helvetica","bold");doc.setTextColor(r,g,b);doc.text(`${sv}`,mg+136,y,{align:"right"});
    y+=8;
  });y+=2;hl();

  txt("YATIRIM ALTERNATİFLERİ",mg,11,true,[15,23,42]);
  alts.slice(0,4).forEach((alt,i)=>{
    const[r,g,b]=alt.score>=85?[22,163,74]:alt.score>=75?[37,99,235]:alt.score>=60?[217,119,6]:[239,68,68];
    if(i%2===0)doc.setFillColor(248,250,252);else doc.setFillColor(255,255,255);
    doc.rect(mg,y-5,W-2*mg,18,"F");
    doc.setFontSize(10);doc.setFont("helvetica","bold");doc.setTextColor(15,23,42);doc.text(`${i+1}. ${alt.name}`,mg+3,y+2);
    doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(100,116,139);doc.text(`CAPEX: ${alt.capex}  ROI: ${alt.roi}  IRR: ${alt.irr}  Süre: ${alt.sure}`,mg+3,y+8);
    doc.setFontSize(11);doc.setFont("helvetica","bold");doc.setTextColor(r,g,b);doc.text(`${alt.score}`,W-mg-3,y+2,{align:"right"});
    y+=20;
  });hl();

  if(parcel.pois&&parcel.pois.length>0){
    txt("YAKIND ÇEVRE (1.5 km)",mg,11,true,[15,23,42]);
    const poiText=parcel.pois.map(p=>`${p.icon} ${p.name}`).join("   ");
    doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(100,116,139);
    const lines=doc.splitTextToSize(poiText,W-2*mg);
    doc.text(lines,mg,y);y+=lines.length*5+4;hl();
  }

  if(parcel.il&&TUIK_NUFUS[parcel.il]){
    txt("NÜFUS VERİSİ (TÜİK 2023)",mg,11,true,[15,23,42]);
    doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(15,23,42);
    doc.text(`${parcel.il} İl Nüfusu: ${TUIK_NUFUS[parcel.il].toLocaleString("tr-TR")} kişi`,mg,y);y+=8;hl();
  }

  doc.setFontSize(7);doc.setTextColor(148,163,184);
  doc.text("Bu rapor ISDBM Digital metodolojisi ile otomatik oluşturulmuştur. Nihai yatırım kararları için uzman görüşü alınız.",mg,y);y+=4;
  doc.text(`ARGEPLANO | ISDBM Digital | ${new Date().toLocaleString("tr-TR")}`,mg,y);
  doc.text("Sayfa 1/1",W-mg,y,{align:"right"});

  doc.save(`ISDBM_${(parcel.projeAdi||parcel.ada||"Rapor").replace(/\s/g,"_")}_${new Date().toISOString().slice(0,10)}.pdf`);
}

// ── Qbiq-inspired auto-scoring from POI data ───────────────────────────────
// Methodology: proximity bands (walking=0-500m, cycling=500-1500m, driving=1500m+)
// weighted by amenity type importance for each metric
function autoScoreFromPOI(pois, alan){
  if(!pois||pois.length===0) return null;

  const counts={school:0,hospital:0,pharmacy:0,bank:0,supermarket:0,bus_station:0,station:0,halt:0,motorway_junction:0,mall:0};
  pois.forEach(p=>{counts[p.type]=(counts[p.type]||0)+1;});

  // Ulaşım: transit + highway access (Qbiq traffic flow logic)
  const transitScore=Math.min(100, ((counts.station+counts.halt)*25) + (counts.bus_station*12) + (counts.motorway_junction*18));
  const ulasim=Math.max(30, Math.min(95, 40+transitScore));

  // Demografi: population services density (Qbiq amenity proximity)
  const demoScore=Math.min(100, (counts.school*15)+(counts.hospital*20)+(counts.pharmacy*10)+(counts.bank*8));
  const demografi=Math.max(30, Math.min(90, 35+demoScore));

  // Ticari: retail + services density
  const ticariScore=Math.min(100, (counts.supermarket*18)+(counts.mall*25)+(counts.bank*12));
  const ticari=Math.max(30, Math.min(90, 35+ticariScore));

  // Altyapı: infer from POI richness (dense POI = good infra)
  const totalPOI=pois.length;
  const altyapi=Math.max(40, Math.min(90, 40+(totalPOI*4)));

  // Risk: more services = lower risk (established area)
  const risk=Math.max(40, Math.min(85, 40+(totalPOI*3)));

  // Gelişme: hospital + school + mall = growing area
  const gelismeScore=(counts.hospital*15)+(counts.school*10)+(counts.mall*20);
  const gelisme=Math.max(35, Math.min(90, 40+gelismeScore));

  // Alan bonusu: büyük arsa = daha yüksek potansiyel
  const alanBonus=alan>50000?5:alan>20000?3:alan>10000?1:0;

  return {
    ulasim:  Math.min(95, ulasim+alanBonus),
    demografi:Math.min(90, demografi),
    ticari:  Math.min(90, ticari+alanBonus),
    altyapi: Math.min(90, altyapi),
    risk:    Math.min(85, risk),
    gelisme: Math.min(90, gelisme+alanBonus),
  };
}

                  <div style={{fontSize:11,color:"#94a3b8"}}>CAPEX: {alt.capex} | ROI: {alt.roi}</div>
                </div>
                <div style={{textAlign:"right"}}><Badge score={alt.score}/><div style={{fontSize:11,color:alt.uygColor,fontWeight:600,marginTop:3}}>{alt.uyg}</div></div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </Shell>;
  }

  // ── Parcels List ───────────────────────────────────────────────────────
  if(screen==="parcels")return <Shell nav="parcels">
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <div style={{fontSize:18,fontWeight:700}}>📐 Tüm Parseller ({parcels.length})</div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-secondary" onClick={exportJSON}>📤 JSON Dışa Aktar</button>
        <button className="btn btn-primary" onClick={()=>{setDrawMode(true);goNav("map");}}>✏️ Yeni Parsel Çiz</button>
      </div>
    </div>
    {parcels.length===0?<div className="card" style={{textAlign:"center",color:"#94a3b8",padding:"48px 0"}}>
      <div style={{fontSize:36,marginBottom:12}}>🗺️</div>
      <div style={{fontWeight:600}}>Henüz parsel yok.</div>
      <div style={{fontSize:13,marginTop:6}}>Harita ekranında "✏️ Parsel Çiz" butonunu kullanın.</div>
      <button className="btn btn-primary" style={{marginTop:16}} onClick={()=>{setDrawMode(true);goNav("map");}}>Haritaya Git →</button>
    </div>:
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {parcels.map(p=>(
        <div key={p.id} className="card" style={{display:"flex",alignItems:"center",gap:14,cursor:"pointer",flexWrap:"wrap"}}
          onClick={()=>{setSelectedParcel(p);setSelectedAlt(null);setScreen("parcel_detail");}}>
          <ScoreRing score={p.score||0} size={60} color={scoreColor(p.score||0)}/>
          <div style={{flex:1,minWidth:150}}>
            <div style={{fontWeight:700,fontSize:14}}>{p.projeAdi||"İsimsiz Parsel"}</div>
            <div style={{fontSize:12,color:"#64748b"}}>{p.il||"?"} / {p.ilce||"?"} — {p.mahalle||""}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>Ada: {p.ada||"—"} / Parsel: {p.parsel||"—"} | Alan: {Number(p.alan||0).toLocaleString("tr-TR")} m² | {p.tarih}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
            <span style={{fontSize:11,fontWeight:600,color:p.status==="Analiz Edildi"?"#16a34a":"#d97706",background:p.status==="Analiz Edildi"?"#dcfce7":"#fef3c7",padding:"2px 10px",borderRadius:20}}>{p.status||"Taslak"}</span>
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-secondary" style={{padding:"5px 10px",fontSize:11}} onClick={e=>{e.stopPropagation();setFlyTo({lat:p.lat,lng:p.lng});goNav("map");}}>🗺️</button>
              <button className="btn btn-primary" style={{padding:"5px 10px",fontSize:11}} onClick={e=>{e.stopPropagation();generatePDF(p,calcAlts(p.metrics||defaultMetrics),p.score||0);}}>📥 PDF</button>
            </div>
          </div>
        </div>
      ))}
    </div>}
  </Shell>;

  // ── Analyze (bulk) ─────────────────────────────────────────────────────
  if(screen==="analyze")return <Shell nav="analyze">
    <div style={{fontSize:18,fontWeight:700,marginBottom:20}}>📊 Karşılaştırmalı Analiz</div>
    {parcels.length<2?<div className="card" style={{textAlign:"center",color:"#94a3b8",padding:"40px 0"}}>
      Karşılaştırma için en az 2 parsel gerekli.
    </div>:
    <div className="card">
      <table className="data-table">
        <thead><tr>
          <th>Parsel</th>
          {METRICS.map(m=><th key={m.key} style={{textAlign:"center"}}>{m.icon} {m.label}</th>)}
          <th style={{textAlign:"center"}}>ISDBM</th>
          <th>En İyi Alt.</th>
        </tr></thead>
        <tbody>{parcels.map(p=>{
          const alts=calcAlts(p.metrics||defaultMetrics);
          return <tr key={p.id} style={{cursor:"pointer"}} onClick={()=>{setSelectedParcel(p);setScreen("parcel_detail");}}>
            <td><div style={{fontWeight:500,fontSize:12}}>{p.projeAdi||`${p.il}/${p.ada}`}</div><div style={{fontSize:10,color:"#94a3b8"}}>{Number(p.alan||0).toLocaleString("tr-TR")} m²</div></td>
            {METRICS.map(m=><td key={m.key} style={{textAlign:"center"}}><Badge score={p.metrics?.[m.key]||50}/></td>)}
            <td style={{textAlign:"center"}}><Badge score={p.score||0}/></td>
            <td style={{fontSize:12}}>{alts[0]?.icon} {alts[0]?.name}</td>
          </tr>;
        })}</tbody>
      </table>
    </div>}
  </Shell>;

  // ── AI Screen ─────────────────────────────────────────────────────────
  if(screen==="ai") return <Shell nav="ai">
    <AIScreen parcels={parcels} selectedParcel={selectedParcel}/>
  </Shell>;

  // ── Reports ────────────────────────────────────────────────────────────
  if(screen==="reports")return <Shell nav="reports">
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
    <div style={{fontSize:18,fontWeight:700,marginBottom:20}}>📄 Raporlar</div>
    {parcels.length===0?<div className="card" style={{textAlign:"center",color:"#94a3b8",padding:"40px 0"}}>Henüz rapor yok.</div>:
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {parcels.map(p=>{
        const alts=calcAlts(p.metrics||defaultMetrics);
        const sc=p.score||calcISDBM(p.metrics||defaultMetrics);
        return <div key={p.id} className="card" style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
          <div style={{fontSize:32}}>📋</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700}}>{p.projeAdi||"İsimsiz"} — ISDBM Analiz Raporu</div>
            <div style={{fontSize:12,color:"#64748b"}}>{p.il} / {p.ilce} | Ada/Parsel: {p.ada||"—"}/{p.parsel||"—"} | ISDBM: {sc} | {p.tarih}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>Alan: {Number(p.alan||0).toLocaleString("tr-TR")} m² | {p.pois?.length||0} yakın tesis bulundu</div>
          </div>
          <button className="btn btn-primary" onClick={()=>generatePDF(p,alts,sc)}>📥 PDF İndir</button>
        </div>;
      })}
    </div>}
  </Shell>;

  return null;
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
