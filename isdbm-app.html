// ── Monte Carlo Risk Analizi ─────────────────────────────────────────────
function runMonteCarlo(params, simCount){
  const {capex, ozkaynakOran, krediFaiz, krediVade, yillikGetiriOran, projYil} = params;

  // Değişken aralıkları — gerçekçi gayrimenkul risk bandları
  const ranges = {
    getiriOran:  {mean: yillikGetiriOran,   std: yillikGetiriOran * 0.25},  // ±%25
    capexArtis:  {mean: 1.0,                std: 0.12},   // inşaat maliyet riski ±%12
    boşlukOran:  {mean: 0.05,               std: 0.04},   // kira boşluğu %5 ±%4
    exitCapRate: {mean: 0.07,               std: 0.015},  // çıkış cap rate %7 ±%1.5
    faizRisk:    {mean: krediFaiz,          std: krediFaiz * 0.15}, // faiz riski ±%15
  };

  // Box-Muller normal dağılım
  function randNorm(mean, std){
    let u=0,v=0;
    while(!u)u=Math.random();
    while(!v)v=Math.random();
    return mean + std * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }

  function calcNPV(rate, cfs){
    return cfs.reduce((npv,cf,t)=>npv+cf/Math.pow(1+rate,t),0);
  }
  function calcIRR(cfs){
    let rate=0.1;
    for(let i=0;i<100;i++){
      const npv=calcNPV(rate,cfs);
      const dNpv=cfs.reduce((s,cf,t)=>t===0?s:s-t*cf/Math.pow(1+rate,t+1),0);
      if(Math.abs(dNpv)<1e-10)break;
      const nr=rate-npv/dNpv;
      if(Math.abs(nr-rate)<1e-6){rate=nr;break;}
      rate=Math.max(-0.99,Math.min(9.99,nr));
    }
    return isFinite(rate)&&rate>-0.99&&rate<9.99?rate*100:null;
  }

  const results = [];
  for(let s=0;s<simCount;s++){
    // Rastgele değişkenler
    const getiri   = Math.max(0, randNorm(ranges.getiriOran.mean, ranges.getiriOran.std));
    const capexCok = Math.max(0.7, randNorm(ranges.capexArtis.mean, ranges.capexArtis.std));
    const boslluk  = Math.max(0, Math.min(0.5, randNorm(ranges.boşlukOran.mean, ranges.boşlukOran.std)));
    const capRate  = Math.max(0.03, randNorm(ranges.exitCapRate.mean, ranges.exitCapRate.std));
    const faiz     = Math.max(1, randNorm(ranges.faizRisk.mean, ranges.faizRisk.std));

    const simCapex   = Math.round(capex * capexCok);
    const ozk        = Math.round(simCapex * (ozkaynakOran/100));
    const krd        = simCapex - ozk;
    const ayFaiz     = faiz/100/12;
    const topAy      = krediVade*12;
    const taksit     = krd>0&&ayFaiz>0 ? krd*(ayFaiz*Math.pow(1+ayFaiz,topAy))/(Math.pow(1+ayFaiz,topAy)-1) : 0;
    const yilTaksit  = taksit*12;

    // Yıllık nakit akışları
    const cfs = [-ozk];
    let kumulatif = -ozk;
    for(let y=1;y<=projYil;y++){
      const gelir = simCapex * (getiri/100) * (1-boslluk);
      const net   = gelir - yilTaksit;
      cfs.push(net);
      kumulatif += net;
    }
    // Exit değeri
    const yillikNOI  = simCapex*(getiri/100)*(1-boslluk);
    const exitDeger  = yillikNOI/capRate;
    const exitNet    = exitDeger - (krd>0?krd*0.6:0); // kalan kredi
    cfs[cfs.length-1] += exitNet;

    const irr = calcIRR(cfs);
    const npv = calcNPV(0.12, cfs); // %12 iskonto

    results.push({
      irr: irr!==null?irr:null,
      npv: npv/1e6, // Milyon TL
      exitDeger: exitDeger/1e6,
      getiri, capexCok, boslluk,
      karlimi: kumulatif+exitNet>0,
    });
  }

  // İstatistikler
  const irrVals = results.filter(r=>r.irr!==null).map(r=>r.irr).sort((a,b)=>a-b);
  const npvVals = results.map(r=>r.npv).sort((a,b)=>a-b);
  const n = results.length;
  const karliSayisi = results.filter(r=>r.karlimi).length;

  function percentile(arr, p){ return arr[Math.floor(arr.length*p/100)]||0; }
  function mean(arr){ return arr.reduce((s,v)=>s+v,0)/arr.length; }

  return {
    simCount: n,
    karliolasilik: Math.round(karliSayisi/n*100),
    irr: {
      p10: percentile(irrVals,10).toFixed(1),
      p25: percentile(irrVals,25).toFixed(1),
      p50: percentile(irrVals,50).toFixed(1),
      p75: percentile(irrVals,75).toFixed(1),
      p90: percentile(irrVals,90).toFixed(1),
      mean: mean(irrVals).toFixed(1),
      negatif: Math.round(irrVals.filter(v=>v<0).length/irrVals.length*100),
    },
    npv: {
      p10: percentile(npvVals,10).toFixed(1),
      p25: percentile(npvVals,25).toFixed(1),
      p50: percentile(npvVals,50).toFixed(1),
      p75: percentile(npvVals,75).toFixed(1),
      p90: percentile(npvVals,90).toFixed(1),
      mean: mean(npvVals).toFixed(1),
      negatif: Math.round(npvVals.filter(v=>v<0).length/npvVals.length*100),
    },
    histogram: buildHistogram(irrVals),
    rawResults: results,
  };
}

function buildHistogram(vals){
  if(!vals.length)return[];
  const min=Math.min(...vals),max=Math.max(...vals);
  const bins=15;
  const step=(max-min)/bins||1;
  const hist=Array.from({length:bins},(_,i)=>({
    x:(min+i*step).toFixed(1),
    count:0,
    pct:0,
  }));
  vals.forEach(v=>{
    const i=Math.min(bins-1,Math.floor((v-min)/step));
    hist[i].count++;
  });
  const maxCount=Math.max(...hist.map(h=>h.count));
  hist.forEach(h=>{h.pct=Math.round(h.count/vals.length*100);h.barH=Math.round(h.count/maxCount*100);});
  return hist;
}

const MonteCarloPanel=({capex,ozkaynakOran,krediFaiz,krediVade,yillikGetiriOran,projYil,parcel,alt})=>{

      const r=runMonteCarlo({capex,ozkaynakOran,krediFaiz,krediVade,yillikGetiriOran,projYil},simCount);

function loadJS(src){
  return new Promise(function(res,rej){
    if(document.querySelector('script[src="'+src+'"]'))return res();
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function loadMapLibre(){
  return new Promise(function(res,rej){
    if(window.maplibregl){res();return;}
    var css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css';document.head.appendChild(css);
    var s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function v3dCtr(p){
  if(p.lng&&p.lat&&Math.abs(p.lat)>0.01)return[+p.lng,+p.lat];
  var a=p.coords||p.coordinates||[];
  if(a.length){var sl=0,sn=0;a.forEach(function(c){sl+=parseFloat(c[0]);sn+=parseFloat(c[1]);});return[sn/a.length,sl/a.length];}
  return null;
}
function fetchPOI3D(lat,lng){
  var mirrors=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  var q='[out:json][timeout:20];(node["amenity"~"pharmacy|hospital|bank|atm|school|bus_station|police|fire_station|restaurant|cafe|supermarket"](around:800,'+lat+','+lng+');node["tourism"~"hotel"](around:800,'+lat+','+lng+'););out body;';
  function parse(d){var seen=new Set(),res=[];(d.elements||[]).forEach(function(el){if(!el.lat||!el.lon)return;var t=el.tags||{},rt=t.amenity||t.tourism||'other',name=t.name||rt;var key=name+Math.round(el.lat*1000);if(seen.has(key))return;seen.add(key);res.push({name:name,type:rt,kat:POI_KAT[rt]||'Diğer',lat:el.lat,lng:el.lon});});return res.slice(0,60);}
  function tryM(i){if(i>=mirrors.length)return Promise.resolve([]);return fetch(mirrors[i],{method:'POST',body:q,signal:AbortSignal.timeout(15000)}).then(function(r){return r.json();}).then(function(d){var p=parse(d);return p.length>0?p:tryM(i+1);}).catch(function(){return tryM(i+1);});}
  return tryM(0);
}

// ── BIM Loader — View3D içinde ──────────────────────────────────────────
function bimLoadModel(files, onModel, onStatus){
  var glbFile=null,objFile=null,mtlFile=null,fbxFile=null,ifcFile=null;
  var fileArr=[];
  // FileList → Array güvenli dönüşüm
  if(files.length!==undefined){for(var fi=0;fi<files.length;fi++)fileArr.push(files[fi]);}
  else{fileArr=Array.from(files);}
  console.log('BIM files:',fileArr.map(function(f){return f.name;}));
  fileArr.forEach(function(f){
    var parts=f.name.split('.');
    var ext=parts[parts.length-1].toLowerCase().trim();
    console.log('ext:',ext,'file:',f.name);
    if(ext==='glb'||ext==='gltf')glbFile=f;
    else if(ext==='obj')objFile=f;
    else if(ext==='mtl')mtlFile=f;
    else if(ext==='fbx')fbxFile=f;
    else if(ext==='ifc')ifcFile=f;
  });
  console.log('parsed:',{glb:!!glbFile,obj:!!objFile,mtl:!!mtlFile,fbx:!!fbxFile,ifc:!!ifcFile});

  if(glbFile){
    onStatus('GLB yükleniyor...');
    loadJS('https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js').then(function(){
      var url=URL.createObjectURL(glbFile);
      new window.THREE.GLTFLoader().load(url,function(g){URL.revokeObjectURL(url);onModel(g.scene,'GLB',glbFile.name);onStatus('');},null,function(e){onStatus('GLB hata:'+e.message);});
    });
  } else if(objFile){
    onStatus('OBJ yükleniyor...');
    loadJS('https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js').then(function(){
      return mtlFile?loadJS('https://unpkg.com/three@0.128.0/examples/js/loaders/MTLLoader.js'):Promise.resolve();
    }).then(function(){
      if(mtlFile&&window.THREE.MTLLoader){
        onStatus('MTL yükleniyor...');
        var mtlUrl=URL.createObjectURL(mtlFile);
        var mtlLoader=new window.THREE.MTLLoader();
        mtlLoader.load(mtlUrl,function(mats){
          URL.revokeObjectURL(mtlUrl);
          mats.preload();
          var objUrl=URL.createObjectURL(objFile);
          var loader=new window.THREE.OBJLoader();
          loader.setMaterials(mats);
          loader.load(objUrl,function(obj){URL.revokeObjectURL(objUrl);onModel(obj,'OBJ+MTL',objFile.name);onStatus('');},null,function(e){onStatus('OBJ hata:'+e.message);});
        });
      } else {
        var objUrl=URL.createObjectURL(objFile);
        new window.THREE.OBJLoader().load(objUrl,function(obj){
          obj.traverse(function(c){if(c.isMesh)c.material=new window.THREE.MeshLambertMaterial({color:0xd4b896,side:window.THREE.DoubleSide});});
          URL.revokeObjectURL(objUrl);onModel(obj,'OBJ',objFile.name);onStatus('');
        },null,function(e){onStatus('OBJ hata:'+e.message);});
      }
    });
  } else if(fbxFile){
    onStatus('FBX yükleniyor...');
    loadJS('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js').then(function(){
      return loadJS('https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js');
    }).then(function(){
      fbxFile.arrayBuffer().then(function(buf){
        try{var fbx=new window.THREE.FBXLoader().parse(buf);onModel(fbx,'FBX',fbxFile.name);onStatus('');}
        catch(e){onStatus('FBX hata:'+e.message);}
      });
    });
  } else if(ifcFile){
    onStatus('IFC yükleniyor...(web-ifc)');
    loadJS('https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/web-ifc-api.js').then(function(){
      return loadJS('https://cdn.jsdelivr.net/npm/web-ifc-three@0.0.126/IFCLoader.js');
    }).then(function(){
      var url=URL.createObjectURL(ifcFile);
      var ldr=new window.IFCLoader();
      ldr.ifcManager.setWasmPath('https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/').then(function(){
        ldr.load(url,function(m){URL.revokeObjectURL(url);onModel(m,'IFC',ifcFile.name);onStatus('');},null,function(e){onStatus('IFC hata:'+e.message);});
      });
    });
  } else {
    onStatus('Desteklenmeyen format. GLB, OBJ(+MTL), FBX, IFC seçin.');
  }
}

// MapLibre CustomLayer — paylaşılan GL context ile Three.js
function createBIMLayer(map, THREE, model, lngLat){
  if(map.getLayer('bim-layer'))map.removeLayer('bim-layer');

  // Model normalize
  var box=new THREE.Box3().setFromObject(model);
  var size=box.getSize(new THREE.Vector3());
  var center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.position.y+=size.y/2;
  var maxDim=Math.max(size.x,size.y,size.z);
  var targetSize=50;
  if(maxDim>0)model.scale.multiplyScalar(targetSize/maxDim);

  var scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.0));
  var sun=new THREE.DirectionalLight(0xfff5e0,0.8);sun.position.set(1,2,1).normalize();scene.add(sun);
  scene.add(model);

  // Transform state — window üzerinden güncellenir
  window.BIM_TRANSFORM = window.BIM_TRANSFORM || {offX:0,offZ:0,offY:0,rotY:0,scale:1,opacity:1.0,color:''};

  var mc0=window.maplibregl.MercatorCoordinate.fromLngLat(lngLat,0);
  var mScale=mc0.meterInMercatorCoordinateUnits();
  var camera=new THREE.Camera();
  var renderer=null;

  map.addLayer({
    id:'bim-layer',
    type:'custom',
    renderingMode:'3d',
    onAdd:function(map,gl){
      renderer=new THREE.WebGLRenderer({canvas:map.getCanvas(),context:gl,antialias:true});
      renderer.autoClear=false;
    },
    render:function(gl,matrix){
      var tr=window.BIM_TRANSFORM;
      // Metre cinsinden offset → derece dönüşümü
      var mPerDegLat=111320;
      var mPerDegLng=111320*Math.cos(lngLat.lat*Math.PI/180);
      var offLng=lngLat.lng + tr.offX/mPerDegLng;
      var offLat=lngLat.lat + (-tr.offZ)/mPerDegLat;
      var alt=tr.offY;
      var mc=window.maplibregl.MercatorCoordinate.fromLngLat({lng:offLng,lat:offLat},alt);
      var sc=mc.meterInMercatorCoordinateUnits()*tr.scale;
      // Rotasyon matisleri
      // Model koordinatı: Three.js Y-up → MapLibre Z-up için rotX uygula
      // Kullanıcı rotasyonu Z ekseninde (yukarıdan bakış açısıyla döndür)
      var rotX=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),Math.PI/2);
      var rotUserZ=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0,0,1),-tr.rotY*Math.PI/180);
      var m=new THREE.Matrix4()
        .makeTranslation(mc.x,mc.y,mc.z)
        .scale(new THREE.Vector3(sc,-sc,sc))
        .multiply(rotUserZ)
        .multiply(rotX);
      camera.projectionMatrix=new THREE.Matrix4().fromArray(matrix).multiply(m);
      // Opacity uygula
      if(tr.opacity!==undefined&&tr.opacity<1.0){
        scene.traverse(function(obj){
          if(obj.isMesh&&obj.material){
            var mats=Array.isArray(obj.material)?obj.material:[obj.material];
            mats.forEach(function(m){m.transparent=true;m.opacity=tr.opacity;});
          }
        });
      }
      // Renk tonu uygula
      if(tr.color){
        var col=parseInt(tr.color.replace('#',''),16);
        scene.traverse(function(obj){
          if(obj.isMesh&&obj.material){
            var mats=Array.isArray(obj.material)?obj.material:[obj.material];
            mats.forEach(function(m){if(m.color)m.color.setHex(col);});
          }
        });
      }
      renderer.resetState();
      renderer.render(scene,camera);
      map.triggerRepaint();
    },
    onRemove:function(){if(renderer)renderer.dispose();}
  });
}
